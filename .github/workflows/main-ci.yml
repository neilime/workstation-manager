---
name: Main - Continuous Integration

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prepared-desktop:
        description: Use the prepared desktop base (disable to compare cold provisioning).
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    with:
      prepared-desktop: ${{ github.event_name != 'workflow_dispatch' || inputs.prepared-desktop }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: write
      packages: write
      pull-requests: write
      security-events: write
      statuses: write
    secrets:
      BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
      BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
      BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
      WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
