---
name: Shared - Continuous Integration

"on":
  workflow_call:
    secrets:
      BITWARDEN_CLIENT_ID:
        required: true
      BITWARDEN_CLIENT_SECRET:
        required: true
      BITWARDEN_PASSWORD:
        required: true
      WORKSTATION_MANAGER_GITHUB_TOKEN:
        required: true

permissions: {}

jobs:
  linter:
    # yamllint disable rule:line-length
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@4a6ed33ba735d57ebbcd89fe8ed35134de599a67 # 0.39.2
    # yamllint enable rule:line-length
    with:
      linter-env: |
        ANSIBLE_CONFIG_FILE=.ansible-lint
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  build-tooling-image:
    name: Resolve tooling image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      packages: write
      pull-requests: read
    outputs:
      built-images: ${{ steps.selected.outputs.built-images }}
      python-version: ${{ steps.runtime.outputs.python-version }}
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tooling build inputs
        id: tooling
        run: python3 ci/tooling_image.py resolve

      - name: Build missing tooling image
        if: steps.tooling.outputs.image == ''
        id: build
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-container/actions/docker/build-image@5ffc3c81daacc57700a14bb91d67edbc67eedc1d # 0.39.0
        # yamllint enable rule:line-length
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: tooling
          tag: ${{ steps.tooling.outputs.tag }}
          context: .
          dockerfile: docker/tooling/Dockerfile
          platform: linux/amd64
          build-args: |
            TOOLING_BASE_DIGEST=${{ steps.tooling.outputs.base-digest }}
            TOOLING_REFRESH=${{ steps.tooling.outputs.refresh }}

      - name: Select immutable tooling image
        id: selected
        env:
          TOOLING_CACHED_IMAGE: ${{ steps.tooling.outputs.image }}
          TOOLING_BUILT_IMAGE: ${{ steps.build.outputs.built-image }}
        run: python3 ci/tooling_image.py select

      - name: Read the tooling Python runtime
        id: runtime
        env:
          TOOLING_IMAGE: ${{ fromJSON(steps.selected.outputs.built-images).tooling.images[0] }}
        run: |
          python_version=$(docker run --rm --entrypoint python3 "$TOOLING_IMAGE" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "python-version=$python_version" >> "$GITHUB_OUTPUT"

  static-ansible:
    name: Ansible checks - ${{ matrix.name }}
    needs: [build-tooling-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workstation_setup
            collection: ansible/collections/ansible_collections/neilime/workstation_setup
          - name: workstation_backup
            collection: ansible/collections/ansible_collections/neilime/workstation_backup
          - name: workstation_restore
            collection: ansible/collections/ansible_collections/neilime/workstation_restore
          - name: workstation_cleanup
            collection: ansible/collections/ansible_collections/neilime/workstation_cleanup
          - name: workstation_state
            collection: ansible/collections/ansible_collections/neilime/workstation_state
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Ansible
        # Includes the sanity-image input; use the next release containing this fix.
        uses: hoverkraft-tech/ci-github-iac/actions/ansible/test@b5da821dac2950df70b90157f168279c3bfef29e # main
        with:
          ansible-requirements: ansible/requirements.txt
          collection: ${{ matrix.collection }}
          target-python-version: ${{ needs.build-tooling-image.outputs.python-version }}
          # Rebuilt upstream image: https://github.com/ansible/ansible/pull/87886
          # yamllint disable rule:line-length
          sanity-image: quay.io/ansible/default-test-container:v2.22-9@sha256:9fabb237384a4faca9dc6bdf3647a224eacf318768986677118a506b4b35f1d6
          # yamllint enable rule:line-length
          galaxy-requirements: ansible/collections/requirements.yml
          report-name: Ansible - ${{ matrix.name }}

  static-host:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: [build-tooling-image]
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: make setup

      - name: Run unit and isolated integration tests
        run: REPORTS_DIR=.reports make test

      - name: Parse host reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@4a6ed33ba735d57ebbcd89fe8ed35134de599a67 # 0.39.2
        with:
          report-paths: .reports/tests/unit.junit.xml,.reports/tests/integration.junit.xml
          report-name: Unit and Integration Validation
          path-mapping: /workspace:.

  e2e:
    name: E2E validation
    needs: [build-tooling-image]
    runs-on: ubuntu-latest
    # Leave time for VM preparation and verified teardown.
    timeout-minutes: 60
    environment: ci
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
      # PHP's source build uses nproc; expose the public runner's four CPUs.
      E2E_VM_CPUS: "4"
      E2E_VM_MEMORY_GIB: "8"
      REPORTS_DIR: .reports
      E2E_REPOSITORY_URL: ${{ format('https://github.com/{0}.git', github.repository) }}
      E2E_BASE_IMAGE: ${{ format('{0}/.cache/e2e-base/desktop.qcow2', github.workspace) }}
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify desktop base image inputs
        id: desktop-base
        run: make e2e-base-inputs

      - name: Restore Lima download cache
        id: lima-cache
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: ~/.cache/lima
          # yamllint disable rule:line-length
          key: lima-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.desktop-base.outputs.source-digest }}
          # yamllint enable rule:line-length

      - name: Restore desktop prerequisite image
        id: desktop-cache
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: .cache/e2e-base
          key: ${{ steps.desktop-base.outputs.key }}

      - name: Build desktop prerequisite image
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools dhcpcd-base qemu-utils
          # Select QEMU user networking for the build appliance on this runner.
          sudo apt-get remove -y passt # codespell:ignore passt
          # Include the maintained DHCP client in the appliance, not just the host.
          printf '%s\n' dhcpcd-base |
            sudo tee "$(guestfish get-path)/supermin.d/workstation-manager-dhcp" >/dev/null
          # Supermin reads the host kernel; keep its network helper unprivileged.
          sudo chmod a+r /boot/vmlinuz-*
          make e2e-base

      - name: Verify desktop prerequisite image
        run: python3 ci/e2e_base_image.py verify --metadata .cache/e2e-base-inputs.json

      # This cache contains only an offline public image, never a running test VM.
      - name: Save desktop prerequisite image
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: .cache/e2e-base
          key: ${{ steps.desktop-base.outputs.key }}

      - name: Prepare e2e tooling and VM configuration
        run: |
          make setup
          python3 -m ci.e2e_vm_config \
            --repository "$GITHUB_REPOSITORY" --revision "$(git rev-parse HEAD)" \
            --image "$E2E_BASE_IMAGE" --cpus "$E2E_VM_CPUS" \
            --memory-gib "$E2E_VM_MEMORY_GIB" --output .cache/e2e-vm.json
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

      - name: Create e2e VM
        id: vm
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-iac/actions/vm/create@2c1945afe85bb687c15da83e332b4c52aabae290 # 1.1.0
        # yamllint enable rule:line-length
        with:
          vm-config: .cache/e2e-vm.json
          startup-timeout-minutes: 20

      # Save public downloads before authenticated actions, even if tests later fail.
      - name: Save Lima download cache
        if: ${{ steps.lima-cache.outputs.cache-hit != 'true' }}
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: ~/.cache/lima
          key: ${{ steps.lima-cache.outputs.cache-primary-key }}

      - name: Initialize e2e stages
        env:
          VM_DIRECTORY: ${{ steps.vm.outputs.vm }}
          VM_INSTANCE: ${{ steps.vm.outputs.name }}
        run: |
          # Bootstrap the same commit that supplies the assertions, including PR merge commits.
          E2E_REPOSITORY_REF="$(git rev-parse HEAD)"
          {
            printf 'E2E_REPOSITORY_REF=%s\n' "$E2E_REPOSITORY_REF"
            printf 'LIMA_HOME=%s\n' "$VM_DIRECTORY"
            printf 'VM_NAME=%s\n' "$VM_INSTANCE"
            # Share one deadline across the nine stages; teardown stays outside.
            printf 'E2E_SUITE_DEADLINE=%s\n' "$(($(date +%s) + 35 * 60))"
          } >> "$GITHUB_ENV"

      - name: Backup - Arrange fixtures and recovery keys
        env:
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
        run: make e2e-stage STAGE=backup-arrange

      - name: Backup - Act
        env:
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
        run: make e2e-stage STAGE=backup-act

      - name: Backup - Prepare assertion expectations
        id: backup-expectations
        run: bash e2e-tests/prepare-assertions.sh "$VM_NAME" backup
      - name: Backup - Assert
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@2c1945afe85bb687c15da83e332b4c52aabae290 # 1.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: e2e-tests/goss/backup.yaml
          test-timeout-minutes: ${{ steps.backup-expectations.outputs.timeout-minutes }}
          report-name: workstation-manager - Backup assertions

      - name: Setup - Arrange archive restoration
        run: make e2e-stage STAGE=setup-arrange

      - name: Setup - Act and prepare desktop assertions
        env:
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          WORKSTATION_MANAGER_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
        run: make e2e-stage STAGE=setup-act

      - name: Setup - Prepare assertion expectations
        id: setup-expectations
        run: bash e2e-tests/prepare-assertions.sh "$VM_NAME" setup
      - name: Setup - Assert
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@2c1945afe85bb687c15da83e332b4c52aabae290 # 1.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: e2e-tests/goss/setup.yaml
          goss-vars: .reports/goss/vars.json
          test-timeout-minutes: ${{ steps.setup-expectations.outputs.timeout-minutes }}
          report-name: workstation-manager - Setup assertions

      - name: Cleanup - Arrange preservation fixtures
        run: make e2e-stage STAGE=cleanup-arrange

      - name: Cleanup - Act
        env:
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
        run: make e2e-stage STAGE=cleanup-act

      - name: Cleanup - Prepare assertion expectations
        id: cleanup-expectations
        run: bash e2e-tests/prepare-assertions.sh "$VM_NAME" cleanup
      - name: Cleanup - Assert
        uses: hoverkraft-tech/ci-github-iac/actions/vm/test@2c1945afe85bb687c15da83e332b4c52aabae290 # 1.1.0
        with:
          vm: ${{ steps.vm.outputs.vm }}
          goss-file: e2e-tests/goss/cleanup.yaml
          goss-vars: .reports/goss/vars.json
          test-timeout-minutes: ${{ steps.cleanup-expectations.outputs.timeout-minutes }}
          report-name: workstation-manager - Cleanup assertions

      - name: Finish e2e fixtures
        if: ${{ always() && steps.vm.outcome == 'success' }}
        env:
          LIMA_HOME: ${{ steps.vm.outputs.vm }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: make e2e-stage STAGE=finish

      - name: Upload e2e desktop screenshot
        id: upload-e2e-desktop-screenshot
        if: ${{ always() }}
        # yamllint disable rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # yamllint enable rule:line-length
        with:
          path: .reports/screenshots/e2e-setup-desktop.png
          if-no-files-found: warn
          archive: false

      - name: Add e2e desktop screenshot to pull request
        if: >-
          ${{
            always()
            && github.event_name == 'pull_request'
            && steps.upload-e2e-desktop-screenshot.outcome == 'success'
            && steps.upload-e2e-desktop-screenshot.outputs.artifact-url != ''
          }}
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@4a6ed33ba735d57ebbcd89fe8ed35134de599a67 # 0.39.2
        # yamllint enable rule:line-length
        with:
          title: "## E2E desktop screenshot"
          body: >-
            ![Desktop after workstation setup](${{
              steps.upload-e2e-desktop-screenshot.outputs.artifact-url
            }})

      - name: Verify browser device removal
        id: browser-teardown
        if: ${{ always() && steps.vm.outcome == 'success' }}
        env:
          LIMA_HOME: ${{ steps.vm.outputs.vm }}
          VM_NAME: ${{ steps.vm.outputs.name }}
        run: make e2e-leave

      - name: Destroy e2e VM
        if: >-
          ${{ always() && steps.vm.outputs.vm != '' &&
            (steps.vm.outcome != 'success' || steps.browser-teardown.outcome == 'success') }}
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-iac/actions/vm/destroy@2c1945afe85bb687c15da83e332b4c52aabae290 # 1.1.0
        # yamllint enable rule:line-length
        with:
          vm: ${{ steps.vm.outputs.vm }}
