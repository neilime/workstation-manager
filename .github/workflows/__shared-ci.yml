---
name: Shared - Continuous Integration

"on":
  workflow_call:
    inputs:
      prepared-desktop:
        description: Use the offline desktop prerequisite image; disable for a cold-base comparison.
        type: boolean
        default: true
    secrets:
      BITWARDEN_CLIENT_ID:
        required: true
      BITWARDEN_CLIENT_SECRET:
        required: true
      BITWARDEN_PASSWORD:
        required: true
      WORKSTATION_MANAGER_GITHUB_TOKEN:
        required: true

permissions: {}

jobs:
  linter:
    # yamllint disable rule:line-length
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
    # yamllint enable rule:line-length
    with:
      linter-env: |
        ANSIBLE_CONFIG_FILE=.ansible-lint
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  build-tooling-image:
    name: Resolve tooling image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      packages: write
      pull-requests: read
    outputs:
      built-images: ${{ steps.selected.outputs.built-images }}
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tooling build inputs
        id: tooling
        run: python3 ci/tooling_image.py resolve

      - name: Build missing tooling image
        if: steps.tooling.outputs.image == ''
        id: build
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-container/actions/docker/build-image@5ffc3c81daacc57700a14bb91d67edbc67eedc1d # 0.39.0
        # yamllint enable rule:line-length
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: tooling
          tag: ${{ steps.tooling.outputs.tag }}
          context: .
          dockerfile: docker/tooling/Dockerfile
          platform: linux/amd64
          build-args: |
            TOOLING_BASE_DIGEST=${{ steps.tooling.outputs.base-digest }}
            TOOLING_REFRESH=${{ steps.tooling.outputs.refresh }}

      - name: Select immutable tooling image
        id: selected
        env:
          TOOLING_CACHED_IMAGE: ${{ steps.tooling.outputs.image }}
          TOOLING_BUILT_IMAGE: ${{ steps.build.outputs.built-image }}
        run: python3 ci/tooling_image.py select

  static-ansible:
    name: Ansible checks
    runs-on: ubuntu-latest
    needs: [build-tooling-image]
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
      ANSIBLE_TEST_CACHE_DIR: .cache/ansible-test
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: make setup

      - name: Identify tooling runtime
        id: tooling-runtime
        run: |
          runtime_layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "$TOOLING_IMAGE")
          runtime_hash=$(printf '%s' "$runtime_layers" | sha256sum | cut -d ' ' -f 1)
          printf 'layers=%s\n' "$runtime_hash" >> "$GITHUB_OUTPUT"

      - name: Cache Ansible test environments
        # yamllint disable rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: .cache/ansible-test
          key: ansible-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.tooling-runtime.outputs.layers }}

      - name: Run Ansible syntax checks
        run: REPORTS_DIR=.reports make check-ansible

      - name: Run Ansible sanity checks
        run: REPORTS_DIR=.reports make check-collections

      - name: Parse static reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          report-paths: .reports/checks/*.sarif,.reports/tests/*.xml
          report-name: Static Validation
          path-mapping: /workspace:.

  static-host:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: [build-tooling-image]
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: make setup

      - name: Run unit and isolated integration tests
        run: REPORTS_DIR=.reports make test

      - name: Parse host reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          report-paths: .reports/tests/unit.junit.xml,.reports/tests/integration.junit.xml
          report-name: Unit and Integration Validation
          path-mapping: /workspace:.

  e2e:
    name: E2E validation
    needs: [build-tooling-image]
    runs-on: ubuntu-latest
    # Leave time for VM preparation and verified teardown.
    timeout-minutes: 60
    environment: ci
    permissions:
      contents: read
      issues: write
      packages: write
      pull-requests: write
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
      # PHP's source build uses nproc; expose the public runner's four CPUs.
      E2E_VM_CPUS: "4"
      E2E_VM_MEMORY_GIB: "8"
      REPORTS_DIR: .reports
      # yamllint disable rule:line-length
      E2E_BASE_IMAGE: ${{ inputs.prepared-desktop && format('{0}/.cache/e2e-base/desktop.qcow2', github.workspace) || '' }}
      # yamllint enable rule:line-length
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Lima
        id: lima-setup
        # yamllint disable rule:line-length
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        # yamllint enable rule:line-length

      - name: Identify desktop base image inputs
        id: desktop-base
        run: make e2e-base-inputs

      - name: Restore Lima download cache
        id: lima-cache
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: ~/.cache/lima
          # yamllint disable rule:line-length
          key: lima-downloads-${{ runner.os }}-${{ runner.arch }}-${{ steps.lima-setup.outputs.version }}-${{ steps.desktop-base.outputs.source-digest }}
          # yamllint enable rule:line-length

      - name: Restore desktop prerequisite image
        if: inputs.prepared-desktop
        id: desktop-cache
        # yamllint disable rule:line-length
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: .cache/e2e-base
          key: ${{ steps.desktop-base.outputs.key }}

      - name: Build desktop prerequisite image
        if: inputs.prepared-desktop && steps.desktop-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools dhcpcd-base
          # Include the maintained DHCP client in the appliance, not just the host.
          printf '%s\n' dhcpcd-base |
            sudo tee "$(guestfish get-path)/supermin.d/workstation-manager-dhcp" >/dev/null
          # Supermin reads the host kernel; keep its network helper unprivileged.
          sudo chmod a+r /boot/vmlinuz-*
          source e2e-tests/e2e-common.sh
          run_e2e_timed_command base-build make e2e-base

      - name: Verify desktop prerequisite image
        if: inputs.prepared-desktop
        run: python3 ci/e2e_base_image.py verify --metadata .cache/e2e-base-inputs.json

      # This cache contains only an offline public image, never a running test VM.
      - name: Save desktop prerequisite image
        if: inputs.prepared-desktop && steps.desktop-cache.outputs.cache-hit != 'true'
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: .cache/e2e-base
          key: ${{ steps.desktop-base.outputs.key }}

      - name: Prepare e2e VM and tooling
        run: make e2e-prepare

      # Save public downloads before authenticated actions, even if tests later fail.
      - name: Save Lima download cache
        if: ${{ steps.lima-cache.outputs.cache-hit != 'true' }}
        # yamllint disable rule:line-length
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: ~/.cache/lima
          key: ${{ steps.lima-cache.outputs.cache-primary-key }}

      - name: Run phased e2e assertions
        timeout-minutes: 35
        env:
          # yamllint disable rule:line-length
          E2E_REPOSITORY_URL: ${{ format('https://github.com/{0}.git', github.repository) }}
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          WORKSTATION_MANAGER_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # yamllint enable rule:line-length
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
          E2E_PROFILE_TASKS: "1"
        run: |
          # Bootstrap the same commit that supplies the assertions, including PR merge commits.
          E2E_REPOSITORY_REF="$(git rev-parse HEAD)"
          export E2E_REPOSITORY_REF
          REPORTS_DIR=.reports make e2e-test

      - name: Parse e2e reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        with:
          report-paths: .reports/tests/e2e-*.junit.xml
          report-name: End-to-End Validation

      - name: Upload e2e desktop screenshot
        id: upload-e2e-desktop-screenshot
        if: ${{ always() }}
        # yamllint disable rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # yamllint enable rule:line-length
        with:
          path: .reports/screenshots/e2e-setup-desktop.png
          if-no-files-found: warn
          archive: false

      - name: Add e2e desktop screenshot to pull request
        if: >-
          ${{
            always()
            && github.event_name == 'pull_request'
            && steps.upload-e2e-desktop-screenshot.outcome == 'success'
            && steps.upload-e2e-desktop-screenshot.outputs.artifact-url != ''
          }}
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@44f6108cef0e9884ea7735f3d62932c2310745d4 # 0.39.1
        # yamllint enable rule:line-length
        with:
          title: "## E2E desktop screenshot"
          body: >-
            ![Desktop after workstation setup](${{
              steps.upload-e2e-desktop-screenshot.outputs.artifact-url
            }})

      - name: Stop e2e VM
        if: ${{ always() }}
        run: make e2e-down

      - name: Upload e2e phase timings
        if: ${{ always() }}
        # yamllint disable rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # yamllint enable rule:line-length
        with:
          name: e2e-phase-timings
          path: .reports/e2e/phase-timings.jsonl
          if-no-files-found: warn
