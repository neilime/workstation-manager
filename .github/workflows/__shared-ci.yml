---
name: Shared - Continuous Integration

"on":
  workflow_call:
    secrets:
      BITWARDEN_CLIENT_ID:
        required: true
      BITWARDEN_CLIENT_SECRET:
        required: true
      BITWARDEN_PASSWORD:
        required: true
      WORKSTATION_MANAGER_GITHUB_TOKEN:
        required: true

permissions: {}

jobs:
  linter:
    # yamllint disable rule:line-length
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
    # yamllint enable rule:line-length
    with:
      linter-env: |
        ANSIBLE_CONFIG_FILE=.ansible-lint
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write

  build-tooling-image:
    # yamllint disable rule:line-length
    uses: hoverkraft-tech/ci-github-container/.github/workflows/docker-build-images.yml@f8255a6a37eb141fa331527f5aed9b9e1d598c77 # 0.38.0
    # yamllint enable rule:line-length
    permissions:
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    with:
      oci-registry: ghcr.io
      sign: false
      images: |
        [
          {
            "name": "tooling",
            "context": ".",
            "dockerfile": "./docker/tooling/Dockerfile",
            "platforms": ["linux/amd64"]
          }
        ]
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  static:
    name: Static checks
    runs-on: ubuntu-latest
    needs: [linter, build-tooling-image]
    permissions:
      contents: read
      packages: read
    env:
      TOOLING_IMAGE: >-
        ${{ fromJSON(needs.build-tooling-image.outputs.built-images).tooling.images[0] }}
      TOOLING_IMAGE_PULL: "1"
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        run: make setup

      - name: Run Ansible syntax checks
        run: REPORTS_DIR=.reports make check-ansible

      - name: Run Ansible sanity and unit tests
        run: REPORTS_DIR=.reports make test

      - name: Parse static reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          report-paths: .reports/tests/*.xml
          report-name: Static Validation
          path-mapping: /workspace:.

  e2e:
    name: E2E validation
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        # yamllint disable rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:line-length
        with:
          persist-credentials: false

      - name: Set up Lima
        id: lima-setup
        # yamllint disable rule:line-length
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        # yamllint enable rule:line-length

      - name: Cache Lima
        # yamllint disable rule:line-length
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # yamllint enable rule:line-length
        with:
          path: ~/.cache/lima
          key: lima-${{ steps.lima-setup.outputs.version }}

      - name: Start e2e VM
        run: make e2e-up

      - name: Run phased e2e assertions
        timeout-minutes: 35
        env:
          # yamllint disable rule:line-length
          E2E_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
          E2E_REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKSTATION_MANAGER_GITHUB_TOKEN: ${{ secrets.WORKSTATION_MANAGER_GITHUB_TOKEN }}
          # yamllint enable rule:line-length
          BITWARDEN_CLIENT_ID: ${{ secrets.BITWARDEN_CLIENT_ID }}
          BITWARDEN_CLIENT_SECRET: ${{ secrets.BITWARDEN_CLIENT_SECRET }}
          BITWARDEN_PASSWORD: ${{ secrets.BITWARDEN_PASSWORD }}
        run: REPORTS_DIR=.reports make e2e-test

      - name: Parse e2e reports
        if: ${{ always() }}
        uses: hoverkraft-tech/ci-github-common/actions/parse-ci-reports@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          report-paths: .reports/tests/e2e-*.junit.xml
          report-name: End-to-End Validation

      - name: Upload e2e desktop screenshot
        id: upload-e2e-desktop-screenshot
        if: ${{ always() }}
        # yamllint disable rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # yamllint enable rule:line-length
        with:
          path: .reports/screenshots/e2e-setup-desktop.png
          if-no-files-found: warn
          archive: false

      - name: Add e2e desktop screenshot to pull request
        if: >-
          ${{
            always()
            && github.event_name == 'pull_request'
            && steps.upload-e2e-desktop-screenshot.outcome == 'success'
            && steps.upload-e2e-desktop-screenshot.outputs.artifact-url != ''
          }}
        # yamllint disable rule:line-length
        uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        # yamllint enable rule:line-length
        with:
          title: "## E2E desktop screenshot"
          body: >-
            ![Desktop after workstation setup](${{
              steps.upload-e2e-desktop-screenshot.outputs.artifact-url
            }})

      - name: Stop e2e VM
        if: ${{ always() }}
        run: make e2e-down
