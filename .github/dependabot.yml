version: 2

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 20
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 20
    directories:
      - "/"
      - "/docker/tooling"
    ignore:
      # Renovate advances the Ubuntu image with the VM and supported-release guard.
      - dependency-name: ubuntu
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 20
    directories:
      - "/ansible"
      - "/docker/tooling"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
