[pytest]
testpaths =
    e2e-tests/unit
    ansible/collections/ansible_collections/neilime/workstation_setup/tests/unit
    ansible/collections/ansible_collections/neilime/workstation_backup/tests/unit
    ansible/collections/ansible_collections/neilime/workstation_restore/tests/unit
    ansible/collections/ansible_collections/neilime/workstation_state/tests/unit
pythonpath = ansible/collections
addopts = --strict-markers
markers =
    integration: isolated local tests that run real Ansible or terminal workflows
