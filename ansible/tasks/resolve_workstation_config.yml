---
- name: Check whether a local private override file exists
  ansible.builtin.stat:
    path: "{{ workstation_private_override_file }}"
  register: workstation_private_override_file_stat
  when: workstation_private_override_file | length > 0

- name: Load local private override values
  ansible.builtin.include_vars:
    file: "{{ workstation_private_override_file }}"
    name: workstation_private_override
  when:
    - workstation_private_override_file | length > 0
    - workstation_private_override_file_stat.stat.exists

- name: Merge public defaults with local private overrides
  ansible.builtin.set_fact:
    workstation_effective: >-
      {{
        workstation_manager
        | combine(
            workstation_private_override | default({}),
            recursive=True,
            list_merge='replace'
          )
      }}

- name: Normalize desired state schema
  ansible.builtin.set_fact:
    workstation_manager_resolved: >-
      {{ workstation_effective |
      neilime.workstation_setup.normalized_workstation_manager(ansible_facts['env']) }}
    workstation_manager_use_become: "{{ workstation_use_become }}"

- name: Validate selected browser adapter entrypoints
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', workstation_browser_adapter_tasks_dir ~ '/' ~ item ~ '.yml', wantlist=True) | length == 1
    fail_msg: >-
      Browser adapter '{{ workstation_manager_resolved.desktop.browser }}' is unavailable or incomplete:
      expected {{ workstation_browser_adapter_tasks_dir }}/{{ item }}.yml.
  vars:
    workstation_browser_adapter_tasks_dir: >-
      {{
        playbook_dir ~ '/collections/ansible_collections/neilime/workstation_setup/roles/browser_'
        ~ workstation_manager_resolved.desktop.browser ~ '/tasks'
      }}
  loop:
    - main
    - inspect_profiles
    - backup
    - reconcile
    - sync

- name: Validate selected AI provider adapters
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.fileglob', workstation_ai_adapter_tasks_dir ~ '/main.yml', wantlist=True) | length == 1
      - lookup('ansible.builtin.fileglob', workstation_ai_adapter_tasks_dir ~ '/preflight.yml', wantlist=True) | length == 1
      - lookup('ansible.builtin.fileglob', workstation_ai_adapter_tasks_dir ~ '/authenticate.yml', wantlist=True) | length == 1
    fail_msg: "AI provider adapter '{{ item }}' requires main.yml, preflight.yml and authenticate.yml entrypoints."
  vars:
    workstation_ai_adapter_tasks_dir: >-
      {{ playbook_dir }}/collections/ansible_collections/neilime/workstation_setup/roles/ai_tool_{{ item }}/tasks
  loop: "{{ workstation_manager_resolved.development.ai_tools.providers | list }}"
