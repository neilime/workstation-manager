---
- name: Verify the configured GitHub account before workstation changes
  ansible.builtin.import_role:
    name: neilime.workstation_setup.development_tooling
    tasks_from: github_auth

- name: Apply system base configuration
  ansible.builtin.import_role:
    name: neilime.workstation_setup.system_base

- name: Apply APT package configuration
  ansible.builtin.import_role:
    name: neilime.workstation_setup.apt_packages

- name: Install independent application and development packages
  block:
    - name: Start Flatpak desktop application installation
      ansible.builtin.import_role:
        name: neilime.workstation_setup.flatpak_apps
      vars:
        flatpak_apps_defer_completion: true

    - name: Apply development tooling
      ansible.builtin.import_role:
        name: neilime.workstation_setup.development_tooling
  always:
    - name: Complete Flatpak installation even when development setup fails
      ansible.builtin.include_role:
        name: neilime.workstation_setup.flatpak_apps
        tasks_from: applications/complete

- name: Restore SSH keys from Bitwarden
  ansible.builtin.import_role:
    name: neilime.workstation_setup.ssh_keys

- name: Restore GPG keys from Bitwarden
  ansible.builtin.import_role:
    name: neilime.workstation_setup.gpg_keys

- name: Apply home-environment bootstrap
  ansible.builtin.import_role:
    name: neilime.workstation_setup.home_environment

- name: Restore workstation backup archive
  ansible.builtin.import_role:
    name: neilime.workstation_restore.state

- name: Install BleachBit cleanup and its weekly schedule
  ansible.builtin.import_role:
    name: neilime.workstation_setup.bleachbit
  when: "'bleachbit' in workstation_manager_resolved.system.packages.apt"

- name: Apply selected browser adapter
  ansible.builtin.include_role:
    name: "neilime.workstation_setup.browser_{{ workstation_manager_resolved.desktop.browser }}"

- name: Remove Snap after application setup and verified data preservation
  become: "{{ workstation_manager_use_become }}"
  neilime.workstation_setup.snap_removal:
    state: absent
  register: workstation_manager_snap_removal

- name: Report the verified Snap recovery archive
  ansible.builtin.debug:
    msg: "Snap data recovery archive: {{ workstation_manager_snap_removal.backup_archive }}"
  when: workstation_manager_snap_removal.backup_archive | length > 0

- name: Apply GNOME desktop preferences
  ansible.builtin.import_role:
    name: neilime.workstation_setup.gnome_preferences

- name: Configure the VS Code host terminal
  ansible.builtin.import_role:
    name: neilime.workstation_setup.editor_terminal

- name: Request VS Code settings sync flow
  ansible.builtin.import_role:
    name: neilime.workstation_setup.editor_settings_sync

- name: Verify persistent GitHub authentication after applying dotfiles
  ansible.builtin.import_role:
    name: neilime.workstation_setup.development_tooling
    tasks_from: github_auth

- name: Provision AI applications and extensions after dotfiles
  ansible.builtin.import_role:
    name: neilime.workstation_setup.ai_tools

- name: Authenticate Docker to GHCR after restoration and provider sign-in
  ansible.builtin.import_role:
    name: neilime.workstation_setup.development_tooling
    tasks_from: ghcr
  when: workstation_manager_resolved.development.github.host == 'github.com'

- name: Provision project skills after restoration and GitHub authentication
  ansible.builtin.import_role:
    name: neilime.workstation_setup.development_tooling
    tasks_from: project_skills
  when: '"github:runkids/skillshare" in workstation_manager_resolved.development.mise.tools'

- name: Apply managed state markers
  ansible.builtin.import_role:
    name: neilime.workstation_state.managed_state
