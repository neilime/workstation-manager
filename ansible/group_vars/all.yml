---
# Setup-owned framework pin; Renovate follows the upstream master branch.
workstation_manager_oh_my_zsh_revision: "4d4cfc287e9d887b81242c0e431b5f49f9cec5c1"

workstation_manager:
  user:
    # Default: current sudo user, then USER, then root.
    name:
    # Default: /home/<name>.
    home:
    # Default: <home>/Documents/dev-projects.
    projects_directory:
  system:
    # Default workstation locale.
    locale: en_US.UTF-8
    # Default workstation timezone.
    timezone: Europe/Paris
    packages:
      # Base packages needed before higher-level package stories run.
      prerequisites:
        - locales
        - tzdata
        - python3-debian
      # Ubuntu repository packages and vendor-managed APT packages.
      apt:
        - bleachbit
        - htop
        - xdg-utils
        - fwupd
      # Refresh APT metadata when the cache is older than this many seconds.
      cache_valid_time: 86400
  desktop:
    clipboard_indicator:
      # The managed GNOME clipboard extension; inherit these pins in private overrides.
      version: "71"
      sha256: "687cb404f9540958ddb0c1de638970572cef73f22f016e5d6c6d6f5d4cd55f97"
    flatpak:
      # Default remote for managed Flatpak applications.
      remote: flathub
      packages:
        - org.torproject.torbrowser-launcher
        - com.slack.Slack
        - com.usebruno.Bruno
        - com.spotify.Client
        - org.videolan.VLC
        - org.jdownloader.JDownloader
        - org.gnome.DejaDup
        - org.libreoffice.LibreOffice
        - com.bitwarden.desktop
    # Select the browser adapter; installation details belong to its role.
    browser: brave
    gnome:
      # An explicit empty list clears the dock favorites.
      favorites:
        - org.gnome.Nautilus.desktop
        - org.gnome.Software.desktop
        - com.bitwarden.desktop.desktop
        - browser
        - com.slack.Slack.desktop
        - com.spotify.Client.desktop
        - com.microsoft.VSCode.desktop
        - org.gnome.Ptyxis.desktop
  development:
    # Complete system runtime, available without shell or mise activation.
    node:
      version: "24.21.0"
    github:
      host: github.com
      # Required GitHub username; set it in ansible/private.override.yml.
      account: ""
      extensions:
        # renovate: datasource=github-releases depName=nektos/gh-act
        nektos/gh-act: "0.2.89"
        # renovate: datasource=github-releases depName=github/gh-stack
        github/gh-stack: "0.2.0"
    packages:
      - git
      - zsh
      - make
      - jq
      - bat
      - fonts-firacode
      - libsecret-tools
      # The mise PHP backend compiles the user runtime and its standard extensions.
      - build-essential
      - autoconf
      - bison
      - re2c
      - pkg-config
      - libxml2-dev
      - libssl-dev
      - libicu-dev
      - libzip-dev
      - libonig-dev
      - libcurl4-openssl-dev
      - libpng-dev
      - libreadline-dev
      - libsqlite3-dev
      - zlib1g-dev
    # Native editor packages; Microsoft APT owns code and its updates.
    editor_packages:
      - code
    orca:
      # renovate: datasource=github-releases depName=stablyai/orca
      version: "1.4.222"
      # Seed only missing settings; preserve existing workspaces and preferences.
      settings:
        theme: system
        terminalFontFamily: Fira Code
    mise:
      version: "2026.10.3"
      # Project mise.toml files may select their own tools and versions.
      tools:
        # renovate: datasource=github-releases depName=starship/starship
        "aqua:starship/starship": "1.26.0"
        # renovate: datasource=github-releases depName=helm/helm
        "aqua:helm/helm": "4.3.0"
        # renovate: datasource=github-releases depName=wagoodman/dive
        "aqua:wagoodman/dive": "0.13.1"
        # Renovate follows stable php-* tags; use the maintained backend explicitly.
        "vfox:jdx/vfox-php": "8.5.11"
        # renovate: datasource=github-releases depName=composer/composer
        "github:composer/composer": "2.10.3"
    # Standard workstation CLIs, installed with the system Node runtime.
    npm_packages:
      "@openai/codex":
        # renovate: datasource=npm depName=@openai/codex
        version: "0.160.1"
        command: codex
      "@github/copilot":
        # renovate: datasource=npm depName=@github/copilot
        version: "1.0.92"
        command: copilot
    settings:
      # Development tooling often needs a higher filesystem watch limit.
      sysctl:
        fs.inotify.max_user_watches: "524288"
  home_environment:
    # Manage user-home dotfiles through the built-in Chezmoi integration.
    chezmoi:
      # Pin a stable Chezmoi release for reproducible workstation bootstrap.
      version: "2.73.0"
      # Git repository used to initialize the managed dotfiles checkout.
      source: "https://github.com/neilime/workstation-config.git"
      # Install the Chezmoi binary to this global path.
      bin_path: /usr/local/bin/chezmoi
      # This repo owns the Chezmoi machine-data config file.
      config_path: .config/chezmoi/chezmoi.yaml

  secrets:
    # Secret restoration is driven by declared Bitwarden collection IDs.
    bitwarden:
      server: https://vault.bitwarden.eu
      # Bitwarden collection UUID for SSH key items.
      ssh_collection_id:
      # Bitwarden collection UUID for GPG key items.
      gpg_collection_id:
      # Profile names, stable IDs, directories, and Sync recovery words live here.
      browser_profiles_collection_id:
