---
workstation_manager:
  user:
    # Default: current sudo user, then USER, then root.
    name:
    # Default: /home/<name>.
    home:
    # Default: <home>/Documents/dev-projects.
    projects_directory:
  system:
    # Default workstation locale.
    locale: en_US.UTF-8
    # Default workstation timezone.
    timezone: Europe/Paris
    packages:
      # Base packages needed before higher-level package stories run.
      prerequisites:
        - locales
        - tzdata
        - python3-debian
      # Ubuntu repository packages and vendor-managed APT packages.
      apt:
        - htop
        - xdg-utils
      # Refresh APT metadata when the cache is older than this many seconds.
      cache_valid_time: 86400
    repositories:
      # Vendor APT repository declarations use explicit deb822 source fields.
      apt: []
    # Extra system directories managed with root ownership by default.
    directories: []
    services:
      # Services to enable when later stories require them.
      enabled: []
      # Services to disable when later stories require them.
      disabled: []
  desktop:
    flatpak:
      # Default remote for managed Flatpak applications.
      remote: flathub
      packages:
        - org.torproject.torbrowser-launcher
        - com.slack.Slack
        - com.usebruno.Bruno
        - com.spotify.Client
        - org.videolan.VLC
        - org.jdownloader.JDownloader
        - com.github.hluk.copyq
        - org.gnome.SimpleScan
        - org.gnome.DejaDup
        - org.libreoffice.LibreOffice
        - com.bitwarden.desktop
    # Select the browser adapter; installation details belong to its role.
    browser: brave
    gnome:
      # Apply the workstation's GNOME appearance and Ubuntu Dock layout.
      dark_mode: true
      show_trash: true
      autostart:
        - desktop_file: com.github.hluk.copyq.desktop
          name: CopyQ
          command: /usr/bin/flatpak run com.github.hluk.copyq --start-server hide
      favorites:
        - org.gnome.Nautilus.desktop
        - org.gnome.Software.desktop
        - com.bitwarden.desktop.desktop
        # The selected browser adapter supplies its desktop entry.
        - browser
        - com.slack.Slack.desktop
        - com.spotify.Client.desktop
        - com.visualstudio.code.desktop
        - orca-ide.desktop
        - org.gnome.Terminal.desktop
  development:
    # Core developer packages installed globally from APT.
    packages:
      - git
      - libnotify-bin
      - zsh
      - make
      - jq
      - bat
      - fonts-firacode
      - build-essential
      - autoconf
      - bison
      - re2c
      - pkg-config
      - libxml2-dev
      - libssl-dev
      - libicu-dev
      - libzip-dev
      - libonig-dev
      - libcurl4-openssl-dev
      - libpng-dev
      - libgd-dev
      - libjpeg-dev
      - libfreetype6-dev
      - libwebp-dev
      - libgmp-dev
      - libsodium-dev
      - libreadline-dev
      - libbz2-dev
      - libsqlite3-dev
    repositories:
      apt: []
    # Optional GUI editor packages, usually delivered by Flatpak.
    editor_packages:
      - com.visualstudio.code
    orca:
      # Setup installs the latest stable official Orca IDE Debian package.
      # Seed settings only on first setup; Orca owns subsequent changes.
      # Worktrees are stored in <projects_directory>/workspaces/orca.
      settings:
        theme: system
        terminalFontFamily: Fira Code
    mise:
      # Common workstation-wide tool defaults. Child folders can override these
      # with their own restored mise.toml files.
      tools:
        node: lts
        php: "8.5.11"
        "aqua:starship/starship": latest
        "aqua:cli/cli": latest
        "github:Giammarco-Ferranti/deja": latest
        "aqua:docker/cli": latest
        "aqua:docker/compose": latest
        "aqua:helm/helm": "4"
        "aqua:wagoodman/dive": latest
      gh_extensions:
        - nektos/gh-act
        - github/gh-stack
      docker_cli_plugins:
        - command: docker-compose
          tool: aqua:docker/compose
    settings:
      # Development tooling often needs a higher filesystem watch limit.
      sysctl:
        fs.inotify.max_user_watches: "524288"
  home_environment:
    # Manage user-home dotfiles through the built-in Chezmoi integration.
    chezmoi:
      # Pin a stable Chezmoi release for reproducible workstation bootstrap.
      version: "2.73.0"
      # Git repository used to initialize the managed dotfiles checkout.
      source: "https://github.com/neilime/workstation-config.git"
      # Apply dotfiles after init.
      apply: true
      # Install the Chezmoi binary to this global path.
      bin_path: /usr/local/bin/chezmoi
      # This repo owns the Chezmoi machine-data config file.
      config_path: .config/chezmoi/chezmoi.yaml

  secrets:
    # Secret restoration is driven by declared Bitwarden collection IDs.
    bitwarden:
      server: https://vault.bitwarden.eu
      # Bitwarden collection UUID for SSH key items.
      ssh_collection_id:
      # Bitwarden collection UUID for GPG key items.
      gpg_collection_id:
      # Profile names, stable IDs, directories, and Sync recovery words live here.
      browser_profiles_collection_id:
