---
- name: Backup workstation user state
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    workstation_use_become: >-
      {{ lookup('env', 'WORKSTATION_MANAGER_USE_BECOME') |
      default('true', true) | bool }}
    workstation_private_override_file: >-
      {{
        workstation_manager_private_override_file |
        default(
          lookup('env', 'WORKSTATION_MANAGER_PRIVATE_OVERRIDE_FILE') |
          default('', true),
          true
        )
      }}

  tasks:
    - name: Resolve workstation config inputs
      ansible.builtin.import_tasks: tasks/resolve_workstation_config.yml

    - name: Initialize backup recovery decisions
      ansible.builtin.set_fact:
        workstation_backup_recovery_skips: []

    - name: Run backup tasks as the managed user
      become: "{{ workstation_manager_use_become }}"
      become_user: "{{ workstation_manager_resolved.user.name }}"
      environment:
        HOME: "{{ workstation_manager_resolved.user.home }}"
        BITWARDENCLI_APPDATA_DIR: "{{ workstation_manager_resolved.user.home }}/.config/Bitwarden CLI"
        SSH_AUTH_SOCK: "{{ lookup('ansible.builtin.env', 'SSH_AUTH_SOCK') }}"
        GPG_TTY: "{{ lookup('ansible.builtin.env', 'GPG_TTY') }}"
        DISPLAY: "{{ lookup('ansible.builtin.env', 'DISPLAY') }}"
        WAYLAND_DISPLAY: "{{ lookup('ansible.builtin.env', 'WAYLAND_DISPLAY') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
      block:
        - name: Synchronize managed chezmoi state before backup
          ansible.builtin.import_role:
            name: neilime.workstation_backup.chezmoi

        - name: Synchronize managed SSH and GPG key material with Bitwarden
          ansible.builtin.import_role:
            name: neilime.workstation_backup.secret_manager_keys

        - name: Resolve backup artifact paths before browser export
          ansible.builtin.import_role:
            name: neilime.workstation_backup.state
            tasks_from: prepare

        - name: Verify browser profile recovery and completed Sync
          ansible.builtin.import_role:
            name: neilime.workstation_backup.browser

        - name: Run backup workflow
          ansible.builtin.import_role:
            name: neilime.workstation_backup.state
