---
# Setup updates managed APT packages to their repository candidates.
- name: Install or update Zsh for the target user's login shell # noqa: package-latest
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: zsh
    state: latest
    force_apt_get: true
    fail_on_autoremove: true

- name: Set Zsh as the target user's login shell
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.user:
    name: "{{ workstation_manager_resolved.user.name }}"
    shell: /usr/bin/zsh

- name: Install the pinned Oh My Zsh checkout for the target user
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ workstation_manager_resolved.user.home }}/.oh-my-zsh"
    version: "{{ workstation_manager_oh_my_zsh_revision }}"
    update: true
    force: false
    recursive: false
    umask: "0022"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    GIT_TERMINAL_PROMPT: "0"
