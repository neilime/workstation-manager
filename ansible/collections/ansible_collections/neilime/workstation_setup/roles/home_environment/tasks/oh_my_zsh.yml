---
- name: Ensure Zsh is installed for the target user's login shell
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: zsh
    state: present

- name: Set Zsh as the target user's login shell
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.user:
    name: "{{ workstation_manager_resolved.user.name }}"
    shell: /usr/bin/zsh

- name: Install the pinned Oh My Zsh checkout for the target user
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ workstation_manager_resolved.user.home }}/.oh-my-zsh"
    # Setup owns this pin; Renovate follows the upstream master branch.
    version: "4d4cfc287e9d887b81242c0e431b5f49f9cec5c1"
    update: true
    force: false
    recursive: false
    umask: "0022"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    GIT_TERMINAL_PROMPT: "0"
