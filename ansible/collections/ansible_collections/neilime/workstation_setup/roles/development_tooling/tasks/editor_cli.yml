---
- name: Ensure the local command directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the VS Code terminal launcher
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    src: editor_cli/code.sh
    dest: /usr/local/bin/code
    owner: root
    group: root
    mode: "0755"
    force: false
