---
- name: Install the Docker repository signing key
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker for the actual Ubuntu release
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ workstation_manager_native_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
  register: workstation_manager_docker_repository

- name: Install Docker Engine and official CLI plugins
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ workstation_manager_docker_repository is changed }}"
    install_recommends: false

- name: Enable the native Docker service
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Grant the managed account Docker group access
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.user:
    name: "{{ workstation_manager_resolved.user.name }}"
    groups:
      - docker
    append: true
  when: not ansible_check_mode

- name: Verify native Docker service access
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.command:
    argv:
      # Start a fresh account context even when Ansible itself runs as this user.
      - /usr/sbin/runuser
      - --user
      - "{{ workstation_manager_resolved.user.name }}"
      - --
      - /usr/bin/docker
      - --host
      - unix:///var/run/docker.sock
      - info
  changed_when: false
  when: not ansible_check_mode

- name: Explain Docker access for already running desktop sessions
  ansible.builtin.debug:
    msg: Log out and back in once if this session predates Docker group membership.
