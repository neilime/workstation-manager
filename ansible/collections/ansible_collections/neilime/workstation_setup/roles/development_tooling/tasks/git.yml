---
- name: Ensure the target user's Git configuration directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: "{{ workstation_manager_resolved.user.home }}/.config/git"
    state: directory
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0700"

- name: Ensure the managed Git configuration file has restricted permissions
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: "{{ workstation_manager_resolved.user.home }}/.config/git/config"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0600"

- name: Enable Git automatic garbage collection with the default threshold
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.git_config:
    name: gc.auto
    scope: file
    file: "{{ workstation_manager_resolved.user.home }}/.config/git/config"
    value: "6700"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
