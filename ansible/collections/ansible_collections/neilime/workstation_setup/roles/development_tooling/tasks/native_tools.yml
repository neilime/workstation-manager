---
- name: Resolve supported native tool architectures
  ansible.builtin.set_fact:
    workstation_manager_native_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], '') }}"
    workstation_manager_node_arch: "{{ {'x86_64': 'x64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], '') }}"

- name: Require a supported native tool architecture
  ansible.builtin.assert:
    that:
      - workstation_manager_native_arch | length > 0
    fail_msg: Native tool installation supports Ubuntu amd64 and arm64.

- name: Install and verify the pinned mise executable
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.get_url:
    url: >-
      https://github.com/jdx/mise/releases/download/v{{ workstation_manager_resolved.development.mise.version
      }}/mise-v{{ workstation_manager_resolved.development.mise.version }}-linux-{{ workstation_manager_node_arch }}
    dest: "{{ workstation_manager_resolved.user.home }}/.local/bin/mise"
    checksum: >-
      sha256:https://github.com/jdx/mise/releases/download/v{{ workstation_manager_resolved.development.mise.version }}/SHASUMS256.txt
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"

- name: Install the complete system Node runtime
  ansible.builtin.import_tasks: node.yml

- name: Ensure native vendor keyring directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install GitHub CLI repository keyring
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure the official GitHub CLI repository
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.deb822_repository:
    name: github-cli
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    architectures: "{{ workstation_manager_native_arch }}"
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
  register: workstation_manager_github_repository

- name: Install native GitHub CLI
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: "{{ workstation_manager_github_repository is changed }}"
    install_recommends: false

- name: Install the official Docker service and plugins
  ansible.builtin.import_tasks: docker.yml

- name: Verify the package-owned Docker plugins
  ansible.builtin.command:
    argv:
      - "/usr/libexec/docker/cli-plugins/docker-{{ item }}"
      - version
  loop:
    - compose
    - buildx
  changed_when: false
  when: not ansible_check_mode
