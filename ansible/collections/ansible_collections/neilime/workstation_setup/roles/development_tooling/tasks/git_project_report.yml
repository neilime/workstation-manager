---
- name: Ensure Git project report user directories exist
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"
  loop:
    - "{{ workstation_manager_resolved.user.home }}/.local/share/workstation-manager"
    - "{{ workstation_manager_resolved.user.home }}/.config/autostart"
    - "{{ workstation_manager_resolved.user.home }}/.config/systemd"
    - "{{ workstation_manager_resolved.user.home }}/.config/systemd/user"
    - "{{ workstation_manager_resolved.user.home }}/.config/systemd/user/timers.target.wants"

- name: Install Git project report helper
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    src: git_project_report/git_project_report.py
    dest: "{{ workstation_manager_resolved.user.home }}/.local/share/workstation-manager/git-project-report.py"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0644"

- name: Install Git project report command wrapper
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.template:
    src: git_project_report/git-project-report-wrapper.sh.j2
    dest: "{{ workstation_manager_resolved.user.home }}/.local/bin/workstation-manager-git-project-report"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"

- name: Install Git project report timer activator
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.template:
    src: git_project_report/git-project-report-activate-timer.sh.j2
    dest: "{{ workstation_manager_resolved.user.home }}/.local/bin/workstation-manager-git-project-report-activate-timer"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"

- name: Install Git project report user service unit
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.template:
    src: git_project_report/git-project-report.service.j2
    dest: "{{ workstation_manager_resolved.user.home }}/.config/systemd/user/workstation-manager-git-project-report.service"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0644"

- name: Install Git project report user timer unit
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.template:
    src: git_project_report/git-project-report.timer.j2
    dest: "{{ workstation_manager_resolved.user.home }}/.config/systemd/user/workstation-manager-git-project-report.timer"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0644"

- name: Enable Git project report timer for future sessions
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.file:
    src: ../workstation-manager-git-project-report.timer
    dest: "{{ workstation_manager_resolved.user.home }}/.config/systemd/user/timers.target.wants/workstation-manager-git-project-report.timer"
    state: link
    force: true

- name: Install Git project report desktop autostart entry
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.template:
    src: git_project_report/git-project-report-autostart.desktop.j2
    dest: "{{ workstation_manager_resolved.user.home }}/.config/autostart/workstation-manager-git-project-report.desktop"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0644"

- name: Resolve target user id for Git project report timer startup
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ workstation_manager_resolved.user.name }}"
  register: workstation_manager_development_git_project_report_user_id
  changed_when: false
  when: not ansible_check_mode

- name: Check whether the target user session bus is available
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: >-
      /run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}/bus
  register: workstation_manager_development_git_project_report_session_bus
  changed_when: false
  when: not ansible_check_mode

- name: Reload the target user systemd manager for the Git project report timer
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - daemon-reload
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}/bus
  changed_when: false
  when:
    - not ansible_check_mode
    - workstation_manager_development_git_project_report_session_bus is defined
    - workstation_manager_development_git_project_report_session_bus.stat.exists

- name: Check whether the Git project report timer is already active
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - workstation-manager-git-project-report.timer
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}/bus
  register: workstation_manager_development_git_project_report_timer_status
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - workstation_manager_development_git_project_report_session_bus is defined
    - workstation_manager_development_git_project_report_session_bus.stat.exists

- name: Start the Git project report timer in the active desktop session
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - start
      - workstation-manager-git-project-report.timer
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ workstation_manager_development_git_project_report_user_id.stdout }}/bus
  changed_when: true
  when:
    - not ansible_check_mode
    - workstation_manager_development_git_project_report_session_bus is defined
    - workstation_manager_development_git_project_report_session_bus.stat.exists
    - workstation_manager_development_git_project_report_timer_status.rc != 0

- name: Report deferred activation for the Git project report timer
  ansible.builtin.debug:
    msg:
      - Git project report timer was installed for the managed user.
      - The desktop autostart entry will activate it on the next graphical login.
  when:
    - not ansible_check_mode
    - workstation_manager_development_git_project_report_session_bus is defined
    - not workstation_manager_development_git_project_report_session_bus.stat.exists
