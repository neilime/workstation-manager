---
- name: Require the single supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == lookup('ansible.builtin.file', playbook_dir ~ '/ubuntu-version') | trim
    fail_msg: >-
      This revision requires Ubuntu {{ lookup('ansible.builtin.file', playbook_dir ~ '/ubuntu-version') | trim }}.
      Upgrade the operating system before running setup.

- name: Inspect Snap boot dependencies before changing the workstation
  become: "{{ workstation_manager_use_become }}"
  neilime.workstation_setup.snap_removal:
    state: inspected

- name: Prevent automatic Snap reinstallation
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/workstation-manager-no-snap
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by workstation-manager.
      Package: snapd
      Pin: version *
      Pin-Priority: -1

- name: Refresh APT metadata for this setup run
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

# Setup updates managed APT packages to their repository candidates.
- name: Install or update system prerequisite packages # noqa: package-latest
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: "{{ workstation_manager_resolved.system.packages.prerequisites }}"
    state: latest
    force_apt_get: true
    fail_on_autoremove: true
    update_cache: true
    cache_valid_time: "{{ workstation_manager_resolved.system.packages.cache_valid_time }}"
  when: workstation_manager_resolved.system.packages.prerequisites | length > 0

- name: Check configured timezone file exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ workstation_manager_resolved.system.timezone }}"
  register: workstation_manager_system_timezone_file

- name: Assert configured timezone file exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.assert:
    that:
      - workstation_manager_system_timezone_file.stat.exists
    fail_msg: >-
      Configured timezone {{ workstation_manager_resolved.system.timezone }} is not
      available on this host.

- name: Ensure configured locale exists
  become: "{{ workstation_manager_use_become }}"
  community.general.locale_gen:
    name: "{{ workstation_manager_resolved.system.locale }}"
    state: present

- name: Write default locale configuration
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    dest: /etc/default/locale
    mode: "0644"
    content: |
      LANG={{ workstation_manager_resolved.system.locale }}
      LANGUAGE={{ workstation_manager_resolved.system.locale.split('.')[0] }}:en
      LC_ALL={{ workstation_manager_resolved.system.locale }}

- name: Write system timezone selection
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    dest: /etc/timezone
    mode: "0644"
    content: "{{ workstation_manager_resolved.system.timezone }}\n"

- name: Link system localtime
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ workstation_manager_resolved.system.timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Ensure the system state directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: "{{ workstation_manager_resolved.system.state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove managed system sysctl configuration when no values are declared
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: /etc/sysctl.d/99-workstation-manager-system.conf
    state: absent
  when: workstation_manager_resolved.system.settings.sysctl | length == 0

- name: Initialize managed system sysctl configuration
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-workstation-manager-system.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by workstation-manager.
  when: workstation_manager_resolved.system.settings.sysctl | length > 0

- name: Apply managed system sysctl entries
  become: "{{ workstation_manager_use_become }}"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-workstation-manager-system.conf
    sysctl_set: true
    reload: false
  loop: >-
    {{
      workstation_manager_resolved.system.settings.sysctl
      | dict2items
      | sort(attribute='key')
    }}
  loop_control:
    label: "{{ item.key }}"
  when: workstation_manager_resolved.system.settings.sysctl | length > 0

