---
- name: Load browser profile definitions from Bitwarden
  ansible.builtin.include_role:
    name: neilime.workstation_setup.browser_profile_collection

- name: Publish Brave desktop application identifier
  ansible.builtin.set_fact:
    workstation_manager_browser_desktop_file: brave-browser.desktop # noqa: var-naming[no-role-prefix]

- name: Ensure Brave APT keyring directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Brave APT repository keyring
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure Brave vendor APT repository
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.deb822_repository:
    name: brave-browser-release
    uris:
      - https://brave-browser-apt-release.s3.brave.com/
    suites:
      - stable
    components:
      - main
    architectures:
      - amd64
      - arm64
    signed_by: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    state: present
  register: browser_brave_repository

# Setup updates managed APT packages to their repository candidates.
- name: Install or update Brave browser package # noqa: package-latest
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: brave-browser
    state: latest
    force_apt_get: true
    fail_on_autoremove: true
    update_cache: true
    cache_valid_time: "{{ 0 if browser_brave_repository is changed else workstation_manager_resolved.system.packages.cache_valid_time }}"

- name: Configure Brave as the target user's default browser
  ansible.builtin.include_tasks: default_browser.yml

- name: Ensure Brave managed policy directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: /etc/brave/policies/managed
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep Brave Sync available without overriding synced preferences
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    dest: /etc/brave/policies/managed/workstation-manager.json
    owner: root
    group: root
    mode: "0644"
    # This permits Sync; joining a chain still requires its recovery code.
    content: |
      {"SyncDisabled": false}

- name: Register native Brave profiles, prompting to close Brave when it is running
  ansible.builtin.include_tasks: register_profiles.yml
  when: (workstation_manager_browser_profiles | length) > 0

- name: Recover configured Brave profiles through Sync
  ansible.builtin.include_tasks: setup_sync.yml
  when: (workstation_manager_browser_profiles | length) > 0
