---
- name: Assert that a Bitwarden collection selector is configured
  ansible.builtin.assert:
    that:
      - bitwarden_collection_id | default('') | length > 0
    fail_msg: >-
      {{ bitwarden_collection_purpose }} requires a non-empty Bitwarden
      collection ID.

- name: Require the configured Bitwarden server
  ansible.builtin.assert:
    that:
      - workstation_manager_resolved.secrets.bitwarden.server | length > 0
    fail_msg: Bitwarden recovery requires a nonempty secrets.bitwarden.server.

- name: Resolve the shared Bitwarden CLI cache
  ansible.builtin.set_fact:
    bitwarden_collection_appdata_dir: "{{ workstation_manager_resolved.user.home }}/.config/Bitwarden CLI"

- name: Authenticate and synchronize Bitwarden as the managed user
  ansible.builtin.import_tasks: authenticate.yml
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_collection_appdata_dir }}"

- name: Read Bitwarden collection items
  ansible.builtin.set_fact:
    bitwarden_collection_items: >-
      {{
        query(
          'neilime.workstation_setup.bitwarden',
          '',
          appdata_dir=bitwarden_collection_appdata_dir,
          collection_id=bitwarden_collection_id,
          bw_session=bitwarden_collection_session
        )
        | first
      }}
  no_log: true
