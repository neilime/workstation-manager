---
- name: Read Bitwarden automation environment
  ansible.builtin.set_fact:
    bitwarden_collection_email: >-
      {{ lookup('ansible.builtin.env', 'BITWARDEN_EMAIL') | default('', true) }}
    bitwarden_collection_client_id: >-
      {{ lookup('ansible.builtin.env', 'BITWARDEN_CLIENT_ID') | default('', true) }}
    bitwarden_collection_client_secret: >-
      {{ lookup('ansible.builtin.env', 'BITWARDEN_CLIENT_SECRET') | default('', true) }}
    bitwarden_collection_password: >-
      {{ lookup('ansible.builtin.env', 'BITWARDEN_PASSWORD') | default('', true) }}
    bitwarden_collection_interactive: >-
      {{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_INTERACTIVE') | default('0', true) == '1' }}
    bitwarden_collection_tty_path: >-
      {{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_TTY') | default('', true) }}
  no_log: true

- name: Identify the current Bitwarden authentication context
  ansible.builtin.set_fact:
    bitwarden_collection_context:
      play: "{{ ansible_play_name }}"
      user: "{{ workstation_manager_resolved.user.name }}"
      home: "{{ workstation_manager_resolved.user.home }}"
      appdata: "{{ bitwarden_collection_appdata_dir }}"
      server: "{{ workstation_manager_resolved.secrets.bitwarden.server }}"
      email: "{{ bitwarden_collection_email }}"
      client_id: "{{ bitwarden_collection_client_id }}"
  no_log: true

- name: Select a session only from the matching action context
  ansible.builtin.set_fact:
    bitwarden_collection_candidate_from_run: >-
      {{
        (bitwarden_collection_run_context | default({})) == bitwarden_collection_context
        and (bitwarden_collection_run_account | default('') | length > 0)
        and (bitwarden_collection_session | default('') | length > 0)
      }}
  no_log: true

- name: Prepare the candidate Bitwarden session for validation
  ansible.builtin.set_fact:
    bitwarden_collection_candidate_session: >-
      {{
        bitwarden_collection_session
        if bitwarden_collection_candidate_from_run
        else lookup('ansible.builtin.env', 'BW_SESSION') | default('', true)
      }}
    bitwarden_collection_session: ""
  no_log: true

- name: Ensure the Bitwarden CLI is available
  check_mode: false
  ansible.builtin.command: bw --version
  register: bitwarden_collection_cli
  changed_when: false
  failed_when: false

- name: Install unzip for Bitwarden CLI extraction
  become: "{{ workstation_manager_use_become }}"
  become_user: root
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
    cache_valid_time: "{{ workstation_manager_resolved.system.packages.cache_valid_time }}"
  when:
    - bitwarden_collection_cli.rc != 0
    - not (ansible_check_mode or (workstation_backup_dry_run | default(false)))

- name: Download the Bitwarden CLI archive
  become: "{{ workstation_manager_use_become }}"
  become_user: root
  ansible.builtin.get_url:
    url: https://bitwarden.com/download/?app=cli&platform=linux
    dest: /tmp/bitwarden-cli-linux.zip
    mode: "0644"
  when:
    - bitwarden_collection_cli.rc != 0
    - not (ansible_check_mode or (workstation_backup_dry_run | default(false)))

- name: Install the Bitwarden CLI binary
  become: "{{ workstation_manager_use_become }}"
  become_user: root
  ansible.builtin.unarchive:
    src: /tmp/bitwarden-cli-linux.zip
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - bitwarden_collection_cli.rc != 0
    - not (ansible_check_mode or (workstation_backup_dry_run | default(false)))

- name: Re-check the Bitwarden CLI after installation
  check_mode: false
  ansible.builtin.command: bw --version
  register: bitwarden_collection_installed_cli
  changed_when: false
  failed_when: false
  when: bitwarden_collection_cli.rc != 0

- name: Assert that the Bitwarden CLI is installed
  ansible.builtin.assert:
    that:
      - bitwarden_collection_cli.rc == 0 or (bitwarden_collection_installed_cli.rc | default(1)) == 0
    fail_msg: >-
      {{ bitwarden_collection_purpose }} requires the Bitwarden CLI, but `bw`
      could not be installed automatically.

- name: Probe the candidate Bitwarden session for reuse
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: status
    session: "{{ bitwarden_collection_candidate_session }}"
  register: bitwarden_collection_reuse_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: bitwarden_collection_candidate_session | length > 0

- name: Decide whether to reuse the validated Bitwarden session
  ansible.builtin.set_fact:
    bitwarden_collection_account_changed: >-
      {{
        bitwarden_collection_candidate_from_run
        and (bitwarden_collection_reuse_probe.rc | default(1)) == 0
        and (bitwarden_collection_reuse_probe.stdout | from_json).get('serverUrl') == bitwarden_collection_context.server
        and (bitwarden_collection_reuse_probe.stdout | from_json).get('status') != 'unauthenticated'
        and (bitwarden_collection_reuse_probe.stdout | from_json).get('userId') != bitwarden_collection_run_account
      }}
    bitwarden_collection_reuse_session: >-
      {{
        (
          bitwarden_collection_candidate_session | length > 0
          and (bitwarden_collection_reuse_probe.rc | default(1)) == 0
          and (bitwarden_collection_reuse_probe.stdout | default('{}') | from_json).get('status') == 'unlocked'
          and (bitwarden_collection_reuse_probe.stdout | default('{}') | from_json).get('serverUrl')
              == workstation_manager_resolved.secrets.bitwarden.server
        ) | bool
      }}
  no_log: true

- name: Stop when the action's Bitwarden account has changed
  ansible.builtin.fail:
    msg: >-
      The Bitwarden account changed during this action. Retry setup or backup
      with the intended account before reading recovery collections.
  when: bitwarden_collection_account_changed

- name: Reuse the unlocked Bitwarden session for this run
  ansible.builtin.set_fact:
    bitwarden_collection_session: "{{ bitwarden_collection_candidate_session }}"
    bitwarden_collection_status: "{{ bitwarden_collection_reuse_probe.stdout | from_json }}"
  no_log: true
  when: bitwarden_collection_reuse_session

- name: Read Bitwarden session status
  check_mode: false
  ansible.builtin.command: bw status
  register: bitwarden_collection_status_command
  changed_when: false
  environment:
    BW_SESSION: ""
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Parse Bitwarden session status
  ansible.builtin.set_fact:
    bitwarden_collection_status: >-
      {{ bitwarden_collection_status_command.stdout | from_json }}
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Require the correct Bitwarden server before a dry run
  ansible.builtin.assert:
    that:
      - bitwarden_collection_status.serverUrl == workstation_manager_resolved.secrets.bitwarden.server
    fail_msg: >-
      The Bitwarden CLI uses a different server. Select the configured secrets.bitwarden.server
      before retrying; dry runs do not change the CLI server configuration.
  when: ansible_check_mode or (workstation_backup_dry_run | default(false))

- name: Ensure Bitwarden authentication data exists before login
  ansible.builtin.assert:
    that:
      - >-
        (bitwarden_collection_email | length > 0)
        or
        (
          (bitwarden_collection_client_id | length > 0)
          and
          (bitwarden_collection_client_secret | length > 0)
        )
    fail_msg: >-
      {{ bitwarden_collection_purpose }} needs either BITWARDEN_EMAIL or both
      BITWARDEN_CLIENT_ID and BITWARDEN_CLIENT_SECRET when the current CLI
      session is unauthenticated or the configured server must change.
  when: >-
    bitwarden_collection_status.status == 'unauthenticated'
    or bitwarden_collection_status.serverUrl != workstation_manager_resolved.secrets.bitwarden.server

- name: Ensure a Bitwarden vault password is available for unlock
  ansible.builtin.assert:
    that:
      - bitwarden_collection_password | length > 0
    fail_msg: >-
      {{ bitwarden_collection_purpose }} needs BITWARDEN_PASSWORD to unlock the
      vault.
  when: not bitwarden_collection_reuse_session

- name: Select the configured Bitwarden server
  ansible.builtin.import_tasks: server.yml

- name: Login to Bitwarden with the configured API key
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: login
    client_id: "{{ bitwarden_collection_client_id }}"
    client_secret: "{{ bitwarden_collection_client_secret }}"
  register: bitwarden_collection_api_key_login
  changed_when: bitwarden_collection_api_key_login.rc == 0
  failed_when: false
  no_log: true
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length == 0
    - bitwarden_collection_client_id | length > 0
    - bitwarden_collection_client_secret | length > 0

- name: Fail when the configured Bitwarden API key is rejected
  ansible.builtin.fail:
    msg: >-
      {{ bitwarden_collection_purpose }} could not authenticate Bitwarden with
      the configured API key.
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length == 0
    - bitwarden_collection_client_id | length > 0
    - bitwarden_collection_client_secret | length > 0
    - (bitwarden_collection_api_key_login.rc | default(1)) != 0

- name: Login to Bitwarden with the configured email and password
  check_mode: false
  neilime.workstation_setup.bitwarden_email_login:
    email: "{{ bitwarden_collection_email }}"
    password: "{{ bitwarden_collection_password }}"
    interactive: "{{ bitwarden_collection_interactive }}"
    tty_path: "{{ bitwarden_collection_tty_path }}"
  register: bitwarden_collection_email_password_login
  no_log: true
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0

- name: Fall back to the configured Bitwarden API key when the email verification prompt is unavailable
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: login
    client_id: "{{ bitwarden_collection_client_id }}"
    client_secret: "{{ bitwarden_collection_client_secret }}"
  register: bitwarden_collection_api_key_login_fallback
  changed_when: bitwarden_collection_api_key_login_fallback.rc == 0
  failed_when: false
  no_log: true
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0
    - >-
      (bitwarden_collection_email_password_login.failure_reason | default(''))
      in ['code_required', 'terminal_unavailable']
    - bitwarden_collection_client_id | length > 0
    - bitwarden_collection_client_secret | length > 0

- name: Fail when the fallback Bitwarden API key is rejected
  ansible.builtin.fail:
    msg: >-
      {{ bitwarden_collection_purpose }} could not authenticate Bitwarden with
      the configured API key.
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0
    - >-
      (bitwarden_collection_email_password_login.failure_reason | default(''))
      in ['code_required', 'terminal_unavailable']
    - bitwarden_collection_client_id | length > 0
    - bitwarden_collection_client_secret | length > 0
    - (bitwarden_collection_api_key_login_fallback.rc | default(1)) != 0

- name: Fail when Bitwarden requires an interactive verification code
  ansible.builtin.fail:
    msg: >-
      {{ bitwarden_collection_purpose }} needs an interactive Bitwarden
      verification code prompt, but no interactive terminal is available.
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0
    - (bitwarden_collection_email_password_login.failure_reason | default('')) == 'code_required'
    - (bitwarden_collection_client_id | length == 0) or (bitwarden_collection_client_secret | length == 0)

- name: Fail when the managed user cannot access the Bitwarden verification terminal
  ansible.builtin.fail:
    msg: >-
      {{ bitwarden_collection_purpose }} could not open the terminal for the
      Bitwarden verification code. Run setup, backup or cleanup from the managed
      user's terminal with the updated workstation.sh entrypoint.
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0
    - (bitwarden_collection_email_password_login.failure_reason | default('')) == 'terminal_unavailable'
    - (bitwarden_collection_client_id | length == 0) or (bitwarden_collection_client_secret | length == 0)

- name: Fail when the supplied Bitwarden email or password is rejected
  ansible.builtin.fail:
    msg: >-
      WORKSTATION_MANAGER_BITWARDEN_EMAIL_PASSWORD_REJECTED:
      {{ bitwarden_collection_purpose }} could not authenticate Bitwarden with
      the supplied email or password.
  when:
    - bitwarden_collection_status.status == 'unauthenticated'
    - bitwarden_collection_email | length > 0
    - (bitwarden_collection_email_password_login.failure_reason | default('')) == 'email_password_rejected'

- name: Unlock the Bitwarden vault for this run
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: unlock
    password: "{{ bitwarden_collection_password }}"
  register: bitwarden_collection_unlock
  changed_when: false
  failed_when: false
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Fail when the supplied Bitwarden vault password is rejected
  ansible.builtin.fail:
    msg: >-
      WORKSTATION_MANAGER_BITWARDEN_PASSWORD_REJECTED:
      {{ bitwarden_collection_purpose }} could not unlock Bitwarden with the
      supplied vault password.
  when:
    - not bitwarden_collection_reuse_session
    - (bitwarden_collection_unlock.rc | default(0)) != 0

- name: Record the unlocked Bitwarden session
  ansible.builtin.set_fact:
    bitwarden_collection_session: "{{ bitwarden_collection_unlock.stdout | trim }}"
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Ensure the Bitwarden session token was acquired
  ansible.builtin.assert:
    that:
      - bitwarden_collection_session | length > 0
    fail_msg: >-
      {{ bitwarden_collection_purpose }} could not obtain a usable Bitwarden
      session token.
  no_log: true

- name: Verify the account after unlocking the Bitwarden session
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: status
    session: "{{ bitwarden_collection_session }}"
  register: bitwarden_collection_unlocked_status
  changed_when: false
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Record the verified Bitwarden account status
  ansible.builtin.set_fact:
    bitwarden_collection_status: "{{ bitwarden_collection_unlocked_status.stdout | from_json }}"
  no_log: true
  when: not bitwarden_collection_reuse_session

- name: Require the expected unlocked Bitwarden account
  ansible.builtin.assert:
    that:
      - bitwarden_collection_status.status == 'unlocked'
      - bitwarden_collection_status.serverUrl == bitwarden_collection_context.server
      - >-
        not bitwarden_collection_candidate_from_run
        or bitwarden_collection_status.get('userId') == bitwarden_collection_run_account
    fail_msg: Bitwarden did not unlock the expected account; retry setup or backup.
  no_log: true

- name: Sync the Bitwarden vault before reading collection items
  check_mode: false
  neilime.workstation_setup.bitwarden_cli:
    operation: sync
    session: "{{ bitwarden_collection_session }}"
  register: bitwarden_collection_sync
  changed_when: false
  failed_when: false
  until: bitwarden_collection_sync.rc == 0
  retries: 3
  delay: 5
  no_log: true

- name: Fail when Bitwarden vault synchronization does not complete
  ansible.builtin.fail:
    msg: >-
      {{ bitwarden_collection_purpose }} could not sync Bitwarden before
      reading collection items.
  when: bitwarden_collection_sync.rc != 0

- name: Remember the verified session context only for this action
  ansible.builtin.set_fact:
    bitwarden_collection_run_context: "{{ bitwarden_collection_context }}"
    bitwarden_collection_run_account: "{{ bitwarden_collection_status.get('userId') | default('', true) }}"
    cacheable: false
  no_log: true
