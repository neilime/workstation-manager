---
- name: Load browser profile metadata
  ansible.builtin.import_tasks: metadata.yml

- name: Recover browser avatar attachments
  block:
    - name: Read encrypted browser avatar attachments into memory
      become: "{{ workstation_manager_use_become }}"
      become_user: "{{ workstation_manager_resolved.user.name }}"
      neilime.workstation_setup.browser_profile_avatars:
        profiles: "{{ workstation_manager_browser_profiles }}"
        session: "{{ bitwarden_collection_session }}"
        appdata_dir: "{{ bitwarden_collection_appdata_dir }}"
      environment:
        HOME: "{{ workstation_manager_resolved.user.home }}"
        XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
      register: browser_profile_collection_avatars
      when: workstation_manager_browser_profiles | selectattr('avatar_attachment_id', 'defined') | list | length > 0
      no_log: true
  rescue:
    - name: Stop when browser avatar recovery remains incomplete
      ansible.builtin.fail:
        msg: >-
          Browser avatar recovery failed after retrying the Bitwarden attachment download.
          Check network access and that the configured browser profiles' avatar.png
          attachments can be downloaded from Bitwarden, then rerun the command.

- name: Publish complete browser avatar recovery # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    workstation_manager_browser_profiles: "{{ browser_profile_collection_avatars.profiles }}"
  when: browser_profile_collection_avatars is not skipped
  no_log: true
