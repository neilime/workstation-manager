---
- name: Resolve private MCP record selectors
  ansible.builtin.set_fact:
    workstation_ai_credential_ids: "{{ workstation_ai_config.mcp_servers | neilime.workstation_setup.ai_credential_ids }}"
    bitwarden_collection_appdata_dir: "{{ workstation_manager_resolved.user.home }}/.config/Bitwarden CLI"
  no_log: true

- name: Authenticate for configured AI credentials when no shared session exists
  ansible.builtin.include_role:
    name: neilime.workstation_setup.bitwarden_collection
    tasks_from: authenticate
    apply:
      environment:
        BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_collection_appdata_dir }}"
  vars:
    bitwarden_collection_purpose: AI MCP credentials
  when:
    - workstation_ai_credential_ids | length > 0
    - bitwarden_collection_session | default('') | length == 0

- name: Read only the selected Bitwarden records
  ansible.builtin.set_fact:
    workstation_ai_records: >-
      {{ workstation_ai_records + (query('neilime.workstation_setup.bitwarden', item,
           appdata_dir=bitwarden_collection_appdata_dir, search='id', result_count=1,
           bw_session=bitwarden_collection_session) | first) }}
  loop: "{{ workstation_ai_credential_ids }}"
  no_log: true
