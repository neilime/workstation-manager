---
- name: Resolve the pinned MCP package directory
  ansible.builtin.set_fact:
    workstation_ai_package_dir: "{{ workstation_ai_root }}/npm/{{ workstation_ai_server.name }}/{{ workstation_ai_server.npm.version }}"

- name: Ensure the MCP package directory exists
  ansible.builtin.file:
    path: "{{ workstation_ai_package_dir }}"
    state: directory
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0700"

- name: Install the pinned MCP server before client startup
  community.general.npm:
    name: "{{ workstation_ai_server.npm.package }}"
    version: "{{ workstation_ai_server.npm.version }}"
    path: "{{ workstation_ai_package_dir }}"
    executable: /usr/local/bin/npm
    production: true
    state: present
  environment:
    NPM_CONFIG_CACHE: "{{ workstation_ai_root }}/npm-cache"
    NPM_CONFIG_USERCONFIG: /dev/null

- name: Expose the pinned MCP package through a stable version-independent path
  ansible.builtin.file:
    src: "{{ workstation_ai_package_dir | basename }}"
    path: "{{ workstation_ai_package_dir | dirname }}/current"
    state: link
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    force: true

- name: Provision the matching Playwright browser
  ansible.builtin.include_tasks: playwright.yml
  when: workstation_ai_server.playwright | length > 0
