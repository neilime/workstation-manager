---
- name: Manage user-owned AI provider installations
  when: workstation_manager_resolved.development.ai_tools.providers | length > 0
  vars:
    ai_tools_npm_prefix: "{{ workstation_manager_resolved.user.home }}/.local/share/workstation-manager/ai-tools/cli"
  block:
    - name: Ensure the managed user owns the AI CLI installation directory
      become: "{{ workstation_manager_use_become }}"
      ansible.builtin.file:
        path: "{{ ai_tools_npm_prefix }}"
        state: directory
        owner: "{{ workstation_manager_resolved.user.name }}"
        group: "{{ workstation_manager_resolved.user.name }}"
        mode: "0700"

    - name: Install pinned AI provider CLIs as the managed user
      become: "{{ workstation_manager_use_become }}"
      become_user: "{{ workstation_manager_resolved.user.name }}"
      community.general.npm:
        name: "{{ item.value.npm }}"
        version: "{{ item.value.version }}"
        global: true
        executable: /usr/local/bin/npm
        state: present
      environment:
        HOME: "{{ workstation_manager_resolved.user.home }}"
        PATH: /usr/local/bin:/usr/bin:/bin
        NPM_CONFIG_PREFIX: "{{ ai_tools_npm_prefix }}"
        NPM_CONFIG_CACHE: "{{ ai_tools_npm_prefix }}/cache"
        NPM_CONFIG_USERCONFIG: /dev/null
      loop: "{{ workstation_manager_resolved.development.ai_tools.providers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Expose user-owned AI CLIs without shell activation
      become: "{{ workstation_manager_use_become }}"
      ansible.builtin.file:
        src: "{{ ai_tools_npm_prefix }}/bin/{{ item.value.command }}"
        dest: "/usr/local/bin/{{ item.value.command }}"
        state: link
        owner: root
        group: root
        follow: false
        force: true
      loop: "{{ workstation_manager_resolved.development.ai_tools.providers | dict2items }}"
      loop_control:
        label: "{{ item.value.command }}"

- name: Verify agent commands without interactive shell activation
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - -i
      - "HOME={{ workstation_manager_resolved.user.home }}"
      - PATH=/usr/local/bin:/usr/bin:/bin
      - "/usr/local/bin/{{ item.value.command }}"
      - --version
  changed_when: false
  loop: "{{ workstation_manager_resolved.development.ai_tools.providers | dict2items }}"
  loop_control:
    label: "{{ item.value.command }}"
  when: not ansible_check_mode
