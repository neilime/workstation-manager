---
# Setup updates managed APT packages to their repository candidates.
- name: Install or update the native scanner application and SANE diagnostics # noqa: package-latest
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: [simple-scan, sane-utils]
    state: latest
    force_apt_get: true
    fail_on_autoremove: true
    install_recommends: false

- name: Remove the duplicate system Flatpak scanner without deleting application data
  become: "{{ workstation_manager_use_become }}"
  community.general.flatpak:
    name: org.gnome.SimpleScan
    state: absent
    method: system

- name: Remove the duplicate user Flatpak scanner without deleting application data
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.flatpak:
    name: org.gnome.SimpleScan
    state: absent
    method: user
