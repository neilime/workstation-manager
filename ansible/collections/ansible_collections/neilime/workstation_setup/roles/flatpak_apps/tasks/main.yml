---
- name: Prepare Flatpak and its configured remote
  ansible.builtin.import_tasks: prerequisites.yml

- name: Install Flatpak applications synchronously
  ansible.builtin.import_tasks: applications/install.yml
  when: not (flatpak_apps_defer_completion | default(false)) or ansible_check_mode

- name: Apply native scanner delivery after synchronous application installation
  ansible.builtin.import_tasks: scanner.yml
  when: not (flatpak_apps_defer_completion | default(false)) or ansible_check_mode

- name: Start Flatpak applications while setup installs development tooling
  ansible.builtin.import_tasks: applications/start.yml
  when:
    - flatpak_apps_defer_completion | default(false)
    - not ansible_check_mode
