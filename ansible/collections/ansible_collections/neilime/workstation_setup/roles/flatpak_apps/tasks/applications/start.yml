---
- name: Start installing or updating declared Flatpak applications
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.command:
    argv: >-
      {{ ['flatpak', 'install', '--system', '--noninteractive', '--app', '--or-update',
          '--', workstation_manager_resolved.desktop.flatpak.remote]
         + workstation_manager_resolved.desktop.flatpak.packages }}
  environment:
    LC_ALL: C
    LANGUAGE: C
  async: 3600
  poll: 0
  register: flatpak_apps_pending_install
  # The completion task reports the package transaction's actual change result.
  changed_when: false
  when: workstation_manager_resolved.desktop.flatpak.packages | length > 0
