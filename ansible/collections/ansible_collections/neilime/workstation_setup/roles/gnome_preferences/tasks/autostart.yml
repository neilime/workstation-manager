---
- name: Inspect the dotfiles-managed CopyQ autostart entry
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.stat:
    path: "{{ workstation_manager_resolved.user.home }}/.config/autostart/com.github.hluk.copyq.desktop"
  register: workstation_manager_gnome_copyq_autostart
  when:
    - not ansible_check_mode
    - "'com.github.hluk.copyq' in workstation_manager_resolved.desktop.flatpak.packages"

- name: Read CopyQ autostart preferences
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.slurp:
    src: "{{ workstation_manager_resolved.user.home }}/.config/autostart/com.github.hluk.copyq.desktop"
  register: workstation_manager_gnome_copyq_autostart_content
  when: workstation_manager_gnome_copyq_autostart.stat.isreg | default(false)

- name: Activate CopyQ in the current desktop session
  ansible.builtin.include_tasks: copyq.yml
  vars:
    workstation_manager_gnome_copyq_desktop_entry: >-
      {{ (workstation_manager_gnome_copyq_autostart_content.content | b64decode
          | community.general.from_ini).get('Desktop Entry', {}) }}
  when:
    - workstation_manager_gnome_copyq_autostart.stat.isreg | default(false)
    - workstation_manager_gnome_copyq_desktop_entry.get('Type') == 'Application'
    - not workstation_manager_gnome_copyq_desktop_entry.get('Hidden', 'false') | bool
    - workstation_manager_gnome_copyq_desktop_entry.get('X-GNOME-Autostart-enabled', 'true') | bool
