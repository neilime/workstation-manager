---
- name: Compute GNOME task privilege requirements
  ansible.builtin.set_fact:
    workstation_manager_gnome_use_become_user: >-
      {{ workstation_manager_use_become and ansible_facts['user_id'] != workstation_manager_resolved.user.name }}
  changed_when: false

- name: Install GNOME preference dependencies
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name:
      - dconf-cli
      - gnome-shell-common
      - gnome-shell-ubuntu-extensions
      - ptyxis
      - python3-psutil
      - python3-gi
    state: present
    update_cache: true
    cache_valid_time: "{{ workstation_manager_resolved.system.packages.cache_valid_time }}"

- name: Ensure target user dconf directory exists
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.file:
    path: "{{ workstation_manager_resolved.user.home }}/.config/dconf"
    state: directory
    mode: "0700"

- name: Inspect the dotfiles-managed wallpaper
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.stat:
    path: "{{ workstation_manager_resolved.user.home }}/.local/share/backgrounds/wallpaper.jpg"
  register: workstation_manager_gnome_wallpaper

- name: Install and enable Clipboard Indicator
  ansible.builtin.include_tasks: clipboard.yml
  vars:
    workstation_manager_clipboard_directory: >-
      {{ workstation_manager_resolved.user.home ~ '/.local/share/workstation-manager/clipboard-indicator/'
         ~ workstation_manager_resolved.desktop.clipboard_indicator.sha256 }}

- name: Bookmark the projects directory in Files
  ansible.builtin.import_tasks: file_bookmarks.yml

- name: Enable GNOME dark mode
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/desktop/interface/color-scheme
    value: "'prefer-dark'"
    state: present

- name: Apply GNOME wallpaper
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: "/org/gnome/desktop/background/{{ item }}"
    value: "{{ workstation_manager_gnome_wallpaper_uri }}"
    state: present
  vars:
    workstation_manager_gnome_wallpaper_uri: >-
      'file://{{ workstation_manager_resolved.user.home }}/.local/share/backgrounds/wallpaper.jpg'
  loop:
    - picture-uri
    - picture-uri-dark
  loop_control:
    label: "{{ item }}"
  when: workstation_manager_gnome_wallpaper.stat.isreg | default(false)

- name: Apply GNOME wallpaper display style
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/desktop/background/picture-options
    value: "'zoom'"
    state: present
  when: workstation_manager_gnome_wallpaper.stat.isreg | default(false)

- name: Apply GNOME favorites
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/favorite-apps
    value: "{{ workstation_manager_gnome_favorites_value }}"
    state: present
  vars:
    workstation_manager_gnome_favorites_value: >-
      {{
        '@as []'
        if workstation_manager_resolved.desktop.gnome.favorites | length == 0
        else
        workstation_manager_resolved.desktop.gnome.favorites
        | map('regex_replace', '^browser$', workstation_manager_browser_desktop_file)
        | list | to_json
      }}
  when: workstation_manager_resolved.desktop.gnome.favorites is not none

- name: Show Trash in Ubuntu Dock
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/extensions/dash-to-dock/show-trash
    value: "true"
    state: present
