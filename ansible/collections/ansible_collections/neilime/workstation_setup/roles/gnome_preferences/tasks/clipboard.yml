---
# Setup updates managed APT packages to their repository candidates.
- name: Install or update the extension archive and settings dependencies # noqa: package-latest
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name:
      - libglib2.0-bin
      - unzip
    state: latest
    force_apt_get: true
    fail_on_autoremove: true

- name: Prepare the versioned clipboard extension directory
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ workstation_manager_resolved.user.home }}/.local/share/gnome-shell/extensions"
    - "{{ workstation_manager_clipboard_directory }}"

- name: Download the pinned reviewed clipboard extension
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.get_url:
    url: >-
      {{ 'https://extensions.gnome.org/extension-data/clipboard-indicatortudmotu.com.v'
         ~ workstation_manager_resolved.desktop.clipboard_indicator.version ~ '.shell-extension.zip' }}
    dest: "{{ workstation_manager_clipboard_directory }}/extension.zip"
    checksum: "sha256:{{ workstation_manager_resolved.desktop.clipboard_indicator.sha256 }}"
    mode: "0644"
  when: not ansible_check_mode

- name: Detect GNOME Shell version
  ansible.builtin.command:
    argv: [gnome-shell, --version]
  changed_when: false
  check_mode: false
  register: workstation_manager_clipboard_shell

- name: Validate the clipboard archive before extraction
  neilime.workstation_setup.clipboard_archive_info:
    path: "{{ workstation_manager_clipboard_directory }}/extension.zip"
    sha256: "{{ workstation_manager_resolved.desktop.clipboard_indicator.sha256 }}"
    version: "{{ workstation_manager_resolved.desktop.clipboard_indicator.version }}"
    shell_version: "{{ workstation_manager_clipboard_shell.stdout }}"
  when: not ansible_check_mode

- name: Extract the reviewed clipboard extension
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.unarchive:
    src: "{{ workstation_manager_clipboard_directory }}/extension.zip"
    dest: "{{ workstation_manager_clipboard_directory }}"
    remote_src: true
  when: not ansible_check_mode

- name: Compile the clipboard settings schema
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - glib-compile-schemas
      - --strict
      - "{{ workstation_manager_clipboard_directory }}/schemas"
    creates: "{{ workstation_manager_clipboard_directory }}/schemas/gschemas.compiled"
  when: not ansible_check_mode

- name: Register the pinned extension with GNOME
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.file:
    src: "{{ workstation_manager_clipboard_directory }}"
    dest: "{{ workstation_manager_resolved.user.home }}/.local/share/gnome-shell/extensions/clipboard-indicator@tudmotu.com"
    state: link
  when: not ansible_check_mode

- name: Read the Chezmoi-owned clipboard profile
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.slurp:
    src: "{{ workstation_manager_resolved.user.home }}/.config/clipboard-indicator/settings.ini"
  register: workstation_manager_clipboard_preferences
  when: not ansible_check_mode

- name: Apply the Chezmoi-owned clipboard preferences
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: "/org/gnome/shell/extensions/clipboard-indicator/{{ item.key }}"
    value: "{{ item.value }}"
  loop: "{{ (workstation_manager_clipboard_preferences.content | b64decode | community.general.from_ini)['clipboard'] | dict2items }}"
  when: not ansible_check_mode

- name: Keep GNOME extension compatibility validation enabled
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/disable-extension-version-validation
    value: "false"

- name: Use the regular clipboard for Ptyxis paste shortcuts
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/Ptyxis/Shortcuts/paste-clipboard
    value: "'<Control>v|<Control><Shift>v|<Shift>Insert'"
    state: present

- name: Read enabled GNOME extensions
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    state: read
  register: workstation_manager_clipboard_enabled

- name: Enable Clipboard Indicator without replacing other extensions
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      @as {{ ((workstation_manager_clipboard_enabled.value
      | default('[]', true)
      | regex_replace('^@as ', '')
      | from_yaml) + ['clipboard-indicator@tudmotu.com'])
      | unique
      | list
      | to_json }}

- name: Read explicitly disabled GNOME extensions
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/disabled-extensions
    state: read
  register: workstation_manager_clipboard_disabled

- name: Remove the selected clipboard extension from the disabled list
  become: "{{ workstation_manager_gnome_use_become_user }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  community.general.dconf:
    key: /org/gnome/shell/disabled-extensions
    value: >-
      @as {{ (workstation_manager_clipboard_disabled.value
      | default('[]', true)
      | regex_replace('^@as ', '')
      | from_yaml)
      | reject('equalto', 'clipboard-indicator@tudmotu.com')
      | list
      | to_json }}

- name: Report clipboard activation
  ansible.builtin.debug:
    msg: Log out and back in to load the pinned Clipboard Indicator release into GNOME Shell.
