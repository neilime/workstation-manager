---
- name: Ensure the managed user's copilot login is available
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_setup.ai_provider_auth:
    home: "{{ workstation_manager_resolved.user.home }}"
    provider: copilot
    executable: "/usr/local/bin/{{ workstation_ai_config.providers.copilot.command }}"
    host: "{{ workstation_manager_resolved.development.github.host }}"
    account: "{{ workstation_manager_resolved.development.github.account }}"
    terminal: >-
      {{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_TTY')
         if lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_INTERACTIVE') == '1' else '' }}
