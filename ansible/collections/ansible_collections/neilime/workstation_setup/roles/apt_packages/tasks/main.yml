---
- name: Install declared APT packages
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.apt:
    name: "{{ workstation_manager_resolved.system.packages.apt }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ workstation_manager_resolved.system.packages.cache_valid_time }}"
  when: workstation_manager_resolved.system.packages.apt | length > 0
