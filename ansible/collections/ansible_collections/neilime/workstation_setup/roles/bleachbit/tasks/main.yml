---
- name: Ensure BleachBit user directories exist
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"
  loop:
    - "{{ workstation_manager_resolved.user.home }}/.local/bin"
    - "{{ workstation_manager_resolved.user.home }}/.local/share/workstation-manager"

- name: Install BleachBit preset helper
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    src: clean/bleachbit_clean.py
    dest: "{{ workstation_manager_resolved.user.home }}/.local/share/workstation-manager/bleachbit-clean.py"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0644"

- name: Install BleachBit clean command wrapper
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.copy:
    src: clean/bleachbit-clean.sh
    dest: "{{ workstation_manager_resolved.user.home }}/.local/bin/workstation-manager-bleachbit-clean"
    owner: "{{ workstation_manager_resolved.user.name }}"
    group: "{{ workstation_manager_resolved.user.name }}"
    mode: "0755"

- name: Enable weekly BleachBit cleanup
  ansible.builtin.import_tasks: schedule.yml
