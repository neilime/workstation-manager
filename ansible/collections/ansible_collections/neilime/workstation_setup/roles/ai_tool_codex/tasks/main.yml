---
- name: Merge private Codex MCP tables
  neilime.workstation_setup.ai_provider_config:
    path: "{{ workstation_manager_resolved.user.home }}/.codex/config.toml"
    state_path: "{{ workstation_ai_state }}/codex-servers.json"
    format: toml
    key: mcp_servers
    servers: "{{ workstation_ai_servers }}"
  no_log: true

- name: Expose declared skills to Codex
  neilime.workstation_setup.ai_skill_links:
    directory: "{{ workstation_manager_resolved.user.home }}/.agents/skills"
    state_path: "{{ workstation_ai_state }}/codex-skills.json"
    skills: "{{ workstation_ai_skills }}"
