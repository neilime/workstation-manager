---
- name: Resolve backup artifact paths and output directory
  ansible.builtin.import_tasks: prepare.yml

- name: Collect filesystem backup sources
  ansible.builtin.import_role:
    name: neilime.workstation_backup.path_sources

- name: Collect Git repository inventory
  ansible.builtin.import_role:
    name: neilime.workstation_backup.git_repositories

- name: Create backup restore command sidecar
  ansible.builtin.import_role:
    name: neilime.workstation_backup.restore_command

- name: Write backup manifest
  ansible.builtin.import_role:
    name: neilime.workstation_backup.manifest

- name: Create backup archive
  ansible.builtin.import_role:
    name: neilime.workstation_backup.archive
