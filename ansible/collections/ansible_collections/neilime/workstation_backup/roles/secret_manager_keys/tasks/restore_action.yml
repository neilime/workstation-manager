---
- name: Check the Bitwarden session before restoring the key
  ansible.builtin.include_tasks: session.yml

- name: Refresh the approved remote key before restoring it
  ansible.builtin.command:
    argv: [bw, sync]
  environment:
    BW_SESSION: "{{ bitwarden_collection_session }}"
    BW_NOINTERACTION: "true"
  changed_when: false
  no_log: true

- name: Read the approved remote key
  ansible.builtin.command:
    argv: [bw, get, item, "{{ item.bitwarden_item_id }}"]
  environment:
    BW_SESSION: "{{ bitwarden_collection_session }}"
    BW_NOINTERACTION: "true"
  register: workstation_backup_secret_manager_remote_key
  changed_when: false
  no_log: true

- name: Require the selected key to remain in its recovery collection
  ansible.builtin.assert:
    that:
      - item.collection_id in (workstation_backup_secret_manager_remote_key.stdout | from_json).collectionIds
  no_log: true

- name: Restore the approved key and verify its local values
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_backup.restore_key:
    kind: "{{ item.kind }}"
    user_home: "{{ workstation_manager_resolved.user.home }}"
    key_item: "{{ workstation_backup_secret_manager_remote_key.stdout | from_json }}"
    identity: >-
      {{ item.name if item.kind == 'ssh'
         else (item.fields | items2dict(key_name='name', value_name='value')).fingerprint }}
  no_log: true
