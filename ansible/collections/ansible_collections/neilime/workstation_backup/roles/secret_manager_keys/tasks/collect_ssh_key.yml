---
- name: Check for the matching SSH public key
  ansible.builtin.stat:
    path: "{{ item.path }}.pub"
  register: workstation_backup_secret_manager_public_key_stat

- name: Require a public key for each local SSH private key
  ansible.builtin.assert:
    that:
      - workstation_backup_secret_manager_public_key_stat.stat.isreg | default(false)
    fail_msg: >-
      {% if item.path.endswith('.pub') %}
      {{ item.path }} contains SSH private-key material despite its .pub filename.
      Check the local key filenames and the Bitwarden private_key/public_key fields.
      Preserve existing key files before correcting the pair: the private key belongs
      in the key file and its matching public key in the same filename with .pub appended.
      {% else %}
      Cannot synchronize SSH private key {{ item.path }} without its public key
      {{ item.path }}.pub. Restore or generate the matching public key before backup.
      {% endif %}
  no_log: false

- name: Read the SSH private key content
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  register: workstation_backup_secret_manager_private_key_content
  no_log: true

- name: Read the SSH public key content
  ansible.builtin.slurp:
    src: "{{ item.path }}.pub"
  register: workstation_backup_secret_manager_public_key_content
  no_log: true

- name: Record the local SSH keypair for synchronization
  ansible.builtin.set_fact:
    workstation_backup_local_ssh_keys: >-
      {{
        workstation_backup_local_ssh_keys
        + [
            {
              'name': item.path | basename,
              'private_key': workstation_backup_secret_manager_private_key_content.content | b64decode,
              'public_key': workstation_backup_secret_manager_public_key_content.content | b64decode
            }
          ]
      }}
  no_log: true
