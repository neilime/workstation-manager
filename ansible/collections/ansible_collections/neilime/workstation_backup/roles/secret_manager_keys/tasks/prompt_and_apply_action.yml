---
- name: Resolve the Bitwarden key synchronization action
  ansible.builtin.include_role:
    name: neilime.workstation_backup.recovery_decision
  vars:
    workstation_backup_recovery_id: key
    workstation_backup_recovery_request:
      scope: "{{ item.kind ~ '-keys' }}"
      summary: >-
        {{ item.kind | upper }} key {{ item.name }}
        {{ 'exists only locally' if item.action == 'add'
           else 'differs between this computer and Bitwarden' }}.
      actions:
        save: Save the local key in Bitwarden, replacing its saved values, then verify.
      skip: Leave this key unchanged in both places and continue with other keys.
      abort_message: "Backup stopped: {{ item.kind }} key {{ item.name }} is not synchronized with Bitwarden."

- name: Apply only the explicitly approved key synchronization action
  ansible.builtin.include_tasks: apply_action.yml
  when:
    - not workstation_backup_dry_run
    - not ansible_check_mode
    - workstation_backup_recovery_choices['key'] == 'save'
  no_log: true
