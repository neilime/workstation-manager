---
- name: Ensure backup has at least one source path
  ansible.builtin.fail:
    msg: no backup sources found
  when:
    - not workstation_backup_dry_run
    - workstation_backup_include_paths | length == 0

- name: Create backup archive
  neilime.workstation_backup.archive_with_progress:
    path: "{{ workstation_backup_include_paths }}"
    dest: "{{ workstation_backup_archive_path }}"
    exclusion_patterns: "{{ workstation_backup_archive_exclusion_patterns }}"
  when:
    - not workstation_backup_dry_run
    - workstation_backup_include_paths | length > 0

- name: Report backup archive path
  ansible.builtin.debug:
    msg: "backup archive written to {{ workstation_backup_archive_path }}"
  when: not workstation_backup_dry_run

- name: Report backup manifest path
  ansible.builtin.debug:
    msg: "backup manifest written to {{ workstation_backup_manifest_path }}"
  when: not workstation_backup_dry_run

- name: Report backup restore command path
  ansible.builtin.debug:
    msg: "backup restore command written to {{ workstation_backup_restore_command_path }}"
  when: not workstation_backup_dry_run

- name: Report incomplete recovery coverage after explicit skips
  ansible.builtin.debug:
    msg: >-
      Archive created with incomplete recovery coverage.
      Skipped checks: {{ workstation_backup_recovery_skips | join(', ') }}.
      Skipping did not add those recovery sources to the archive.
      See the recovery_skipped records in {{ workstation_backup_manifest_path }}.
  when:
    - not workstation_backup_dry_run
    - workstation_backup_recovery_skips | default([]) | length > 0
