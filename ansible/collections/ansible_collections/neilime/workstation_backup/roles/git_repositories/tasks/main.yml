---
- name: Collect Git repository metadata
  neilime.workstation_backup.git_repository_inventory:
    projects_directory: "{{ workstation_backup_projects_directory }}"
  register: workstation_backup_git_inventory_result

- name: Build Git repository inventory records
  ansible.builtin.set_fact:
    workstation_backup_git_repository_inventory: "{{ workstation_backup_git_inventory_result.repositories }}"

- name: Write Git repository inventory
  ansible.builtin.copy:
    dest: "{{ workstation_backup_git_inventory_path }}"
    mode: "0600"
    content: "{{ workstation_backup_git_repository_inventory | to_nice_json }}\n"

- name: Record Git repository inventory in the backup manifest
  ansible.builtin.set_fact:
    workstation_backup_manifest_lines: >-
      {{
        workstation_backup_manifest_lines + [
          'export' ~ workstation_backup_tab ~
          'git-repositories' ~ workstation_backup_tab ~
          workstation_backup_git_inventory_path
        ]
      }}
