---
- name: Verify browser recovery and resolve drift before archiving
  ansible.builtin.include_tasks: verify.yml

- name: Prepare automatic browser recovery verification
  ansible.builtin.set_fact:
    workstation_backup_browser_live_verified: false
    workstation_backup_browser_live_request:
      scope: browser-sync
      summary: "{{ workstation_backup_browser_sync_instructions }}"
      actions:
        sync: Run Sync and check every recovery code against Bitwarden automatically.
      skip: Continue backup with browser recovery unverified.
      abort_message: Browser recovery was not verified; no archive was created.

- name: Synchronize and verify browser recovery
  ansible.builtin.include_tasks: sync.yml
  when:
    - not workstation_backup_browser_has_drift
    - workstation_backup_browser_inspection.profiles | length > 0

- name: Export browser bookmarks and non-secret preferences
  ansible.builtin.include_tasks: export.yml
