---
- name: Reload browser profiles and recovery records from Bitwarden
  ansible.builtin.include_role:
    name: neilime.workstation_setup.browser_profile_collection

- name: Inspect native profiles against the Bitwarden collection
  ansible.builtin.include_role:
    name: "neilime.workstation_setup.browser_{{ workstation_manager_resolved.desktop.browser }}"
    tasks_from: backup

- name: Decide whether browser recovery still has drift
  ansible.builtin.set_fact:
    workstation_backup_browser_has_drift: >-
      {{ workstation_backup_browser_inspection.drift | length > 0
         or workstation_backup_browser_inspection.sync_issues | length > 0 }}

- name: Report matching saved browser settings
  ansible.builtin.debug:
    msg: "{{ workstation_backup_browser_recovery_report.splitlines() }}"
  when: not workstation_backup_browser_has_drift

- name: Resolve browser recovery drift
  ansible.builtin.include_role:
    name: neilime.workstation_backup.recovery_decision
  vars:
    workstation_backup_recovery_id: browser-recovery
    workstation_backup_recovery_needed: "{{ workstation_backup_browser_has_drift }}"
    workstation_backup_recovery_request:
      scope: browser-recovery
      summary: "{{ workstation_backup_browser_recovery_report }}"
      actions:
        retry: Recheck profiles and Bitwarden after you fix these issues.
      skip: Leave browser state unchanged and skip the remaining browser recovery checks.
      abort_message: Browser recovery was not synchronized; no archive was created.

- name: Recheck browser recovery after the user resolves drift
  ansible.builtin.include_tasks: verify.yml
  when: workstation_backup_recovery_choices['browser-recovery'] == 'retry'
