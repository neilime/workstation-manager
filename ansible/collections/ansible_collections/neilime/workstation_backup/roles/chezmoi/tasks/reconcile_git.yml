---
- name: Inspect the chezmoi tracking branch before synchronization
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_backup.git_sync:
    source: "{{ workstation_backup_chezmoi_source_dir }}"
    github_token: "{{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_GITHUB_TOKEN') }}"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
  check_mode: "{{ workstation_backup_dry_run }}"
  register: workstation_backup_chezmoi_git_preflight

- name: Resolve whether the chezmoi source requires reconciliation
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_git_needs_decision: >-
      {{ workstation_backup_chezmoi_git_preflight.state.behind > 0 or workstation_backup_chezmoi_git_preflight.state.needs_publish }}

- name: Report unpublished chezmoi state during backup dry runs
  ansible.builtin.debug:
    msg: >-
      Chezmoi remote completion is unverified in a dry run; no fetch or source changes were performed.
      Local tracking state: {{ workstation_backup_chezmoi_git_preflight.state }}
  when: workstation_backup_dry_run

- name: Resolve chezmoi tracking branch drift
  ansible.builtin.include_role:
    name: neilime.workstation_backup.recovery_decision
  vars:
    workstation_backup_recovery_id: chezmoi-git
    workstation_backup_recovery_needed: "{{ workstation_backup_chezmoi_git_needs_decision }}"
    workstation_backup_recovery_request:
      scope: chezmoi
      summary: |-
        Chezmoi source: {{ workstation_backup_chezmoi_source_dir }}
        Tracking: {{ workstation_backup_chezmoi_git_preflight.state.upstream }}
        Ahead: {{ workstation_backup_chezmoi_git_preflight.state.ahead }} commits; behind: {{ workstation_backup_chezmoi_git_preflight.state.behind }} commits.

        Source changes:
        {{ workstation_backup_chezmoi_git_preflight.state.status or '(none)' }}

        These actions do not push; publication requires separate approval.
        Managed workstation files will be checked after reconciliation.
      actions: >-
        {{ (
             {'merge': 'Commit source edits as "Update managed dotfiles", then fast-forward or merge upstream without rewriting local history. '
                       ~ 'Conflicts stop backup for manual resolution.'}
             if workstation_backup_chezmoi_git_preflight.state.behind > 0
             else {'keep': 'Retain local source edits and commits for later publication.'}
           ) | combine({
             'use-remote': 'Replace the source with the fetched remote version. Discards source edits, non-ignored untracked files, '
                           ~ 'and local-only commits after a separate confirmation.',
             'retry': 'Recheck after you reconcile manually in another terminal.'
           }) }}
      skip: Leave Chezmoi unchanged and skip its remaining recovery checks.
      abort_message: Backup stopped because the chezmoi tracking branch has not been reconciled.

- name: Confirm discarding local chezmoi source changes
  ansible.builtin.include_role:
    name: neilime.workstation_backup.recovery_decision
  vars:
    workstation_backup_recovery_id: chezmoi-discard
    workstation_backup_recovery_needed: "{{ workstation_backup_recovery_choices['chezmoi-git'] == 'use-remote' }}"
    workstation_backup_recovery_request:
      scope: chezmoi
      summary: |-
        Replace {{ workstation_backup_chezmoi_source_dir }}
        with {{ workstation_backup_chezmoi_git_preflight.state.upstream }}?

        This discards staged and unstaged source edits and deletes non-ignored
        untracked source files. It also removes
        {{ workstation_backup_chezmoi_git_preflight.state.ahead }} local-only commits from this branch.
        No commit or stash saves these edits, and nothing is pushed.
        Workstation files require a separate apply decision afterward.
      actions:
        discard: Confirm discarding these local source edits, untracked files, and local-only commits.
      skip: Leave Chezmoi unchanged and skip its remaining recovery checks.
      abort_message: Backup stopped without discarding local chezmoi source changes.

- name: Reconcile or recheck the chezmoi tracking branch after the chosen action
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_backup.git_sync:
    source: "{{ workstation_backup_chezmoi_source_dir }}"
    merge: "{{ workstation_backup_recovery_choices['chezmoi-git'] == 'merge' }}"
    reset_to_upstream: "{{ workstation_backup_recovery_choices['chezmoi-discard'] == 'discard' }}"
    github_token: "{{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_GITHUB_TOKEN') }}"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
  register: workstation_backup_chezmoi_git_reconciliation
  when:
    - not workstation_backup_dry_run
    - workstation_backup_recovery_choices['chezmoi-git'] in ['merge', 'keep', 'use-remote', 'retry']

- name: Require completed chezmoi tracking branch reconciliation
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_git_reconciliation.state.behind == 0
    fail_msg: >-
      Chezmoi is still behind its tracking branch. Reconcile {{ workstation_backup_chezmoi_source_dir }}
      and retry backup; no archive has been created.
  when:
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_git_needs_decision
