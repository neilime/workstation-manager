---
- name: Resolve backup chezmoi settings
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_config_path: >-
      {{
        workstation_manager_resolved.home_environment.chezmoi.config_path
        if workstation_manager_resolved.home_environment.chezmoi.config_path.startswith('/')
        else (
          workstation_manager_resolved.user.home ~ '/'
          ~ workstation_manager_resolved.home_environment.chezmoi.config_path[2:]
          if workstation_manager_resolved.home_environment.chezmoi.config_path.startswith('~/')
          else workstation_manager_resolved.user.home ~ '/'
          ~ workstation_manager_resolved.home_environment.chezmoi.config_path
        )
      }}
    workstation_backup_chezmoi_source_dir: >-
      {{ workstation_manager_resolved.user.home ~ '/.local/share/chezmoi' }}
    workstation_backup_chezmoi_interactive: >-
      {{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_INTERACTIVE') | default('0', true) | bool }}

- name: Check whether the managed chezmoi config file exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: "{{ workstation_backup_chezmoi_config_path }}"
  register: workstation_backup_chezmoi_config_stat

- name: Check whether the managed chezmoi source directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: "{{ workstation_backup_chezmoi_source_dir }}"
  register: workstation_backup_chezmoi_source_dir_stat

- name: Resolve whether managed chezmoi state is bootstrapped
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_bootstrapped: >-
      {{
        workstation_backup_chezmoi_config_stat.stat.exists
        and workstation_backup_chezmoi_source_dir_stat.stat.exists
        and workstation_backup_chezmoi_source_dir_stat.stat.isdir
      }}

- name: Assert that chezmoi bootstrap state is not partial
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_config_stat.stat.exists == workstation_backup_chezmoi_source_dir_stat.stat.exists
      - not workstation_backup_chezmoi_config_stat.stat.exists or workstation_backup_chezmoi_config_stat.stat.isreg
      - not workstation_backup_chezmoi_source_dir_stat.stat.exists or workstation_backup_chezmoi_source_dir_stat.stat.isdir
    fail_msg: >-
      Backup found partial chezmoi bootstrap state. Expected both
      {{ workstation_backup_chezmoi_config_path }} and
      {{ workstation_backup_chezmoi_source_dir }} to either exist together or
      both be absent.

- name: Require initialized chezmoi recovery state for backup
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_bootstrapped
    fail_msg: Chezmoi is not initialized. Run workstation setup before backing up managed home state.
  when: not workstation_backup_dry_run

- name: Report missing chezmoi initialization during backup dry runs
  ansible.builtin.debug:
    msg: Chezmoi is not initialized; synchronization cannot be verified. Run workstation setup before a real backup.
  when:
    - workstation_backup_dry_run
    - not workstation_backup_chezmoi_bootstrapped

- name: Check whether chezmoi is installed for backup preflight
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - --version
  register: workstation_backup_chezmoi_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: workstation_backup_chezmoi_bootstrapped

- name: Assert that chezmoi is available for backup preflight
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_version.rc == 0
    fail_msg: >-
      Backup chezmoi synchronization requires {{ workstation_manager_resolved.home_environment.chezmoi.bin_path }},
      but it is not available on this machine.
  when: workstation_backup_chezmoi_bootstrapped

- name: Reconcile the chezmoi tracking branch before comparing managed files
  ansible.builtin.include_tasks: reconcile_git.yml
  when: workstation_backup_chezmoi_bootstrapped

- name: Check whether chezmoi status has drift before backup
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - status
      - --path-style
      - absolute
  register: workstation_backup_chezmoi_status
  changed_when: false
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
    CHEZMOI_CONFIG_FILE: "{{ workstation_backup_chezmoi_config_path }}"
  check_mode: false
  when: workstation_backup_chezmoi_bootstrapped

- name: Report chezmoi drift during backup dry runs
  ansible.builtin.debug:
    msg: >-
      Backup would require chezmoi synchronization before archiving managed home
      state. Current drift:
      {{ '\n' ~ workstation_backup_chezmoi_status.stdout if workstation_backup_chezmoi_status.stdout | trim | length > 0 else '' }}
  when:
    - workstation_backup_chezmoi_bootstrapped
    - workstation_backup_dry_run
    - workstation_backup_chezmoi_status.stdout | trim | length > 0

- name: Fail when chezmoi drift requires an interactive decision
  ansible.builtin.fail:
    msg: >-
      Backup found managed chezmoi drift, but this run is non-interactive.
      Re-run with an interactive terminal to choose re-add, apply, or abort.
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_status.stdout | trim | length > 0
    - not workstation_backup_chezmoi_interactive

- name: Prompt for the chezmoi synchronization action
  ansible.builtin.pause:
    prompt: >-
      Managed chezmoi files are out of sync before backup.
      Choose [re-add/apply/abort]. Re-add captures current workstation files in the source;
      apply overwrites managed workstation files with the source, including any newly merged upstream changes.
      Current drift:
      {{ '\n' ~ workstation_backup_chezmoi_status.stdout }}
  register: workstation_backup_chezmoi_user_choice
  until: workstation_backup_chezmoi_user_choice.user_input | trim | lower in ['re-add', 'apply', 'abort']
  retries: 3
  delay: 0
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_status.stdout | trim | length > 0
    - workstation_backup_chezmoi_interactive

- name: Stop backup when chezmoi synchronization is declined
  ansible.builtin.fail:
    msg: Backup stopped because managed chezmoi files are not synchronized.
  when:
    - workstation_backup_chezmoi_user_choice.user_input | default('') | trim | lower == 'abort'

- name: Re-add modified managed files into the chezmoi source state
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - re-add
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
    CHEZMOI_CONFIG_FILE: "{{ workstation_backup_chezmoi_config_path }}"
  changed_when: true
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_status.stdout | trim | length > 0
    - workstation_backup_chezmoi_interactive
    - workstation_backup_chezmoi_user_choice.user_input | trim | lower == 're-add'

- name: Apply chezmoi source state to the managed target files
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - apply
      - --force
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
    CHEZMOI_CONFIG_FILE: "{{ workstation_backup_chezmoi_config_path }}"
  changed_when: true
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_status.stdout | trim | length > 0
    - workstation_backup_chezmoi_interactive
    - workstation_backup_chezmoi_user_choice.user_input | trim | lower == 'apply'

- name: Re-check chezmoi status after synchronization action
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - status
      - --path-style
      - absolute
  register: workstation_backup_chezmoi_status_after_sync
  changed_when: false
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
    XDG_CONFIG_HOME: "{{ workstation_manager_resolved.user.home }}/.config"
    CHEZMOI_CONFIG_FILE: "{{ workstation_backup_chezmoi_config_path }}"
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run

- name: Assert that chezmoi is synchronized after the chosen action
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_status_after_sync.stdout | trim | length == 0
    fail_msg: >-
      Backup could not fully synchronize managed chezmoi files. Remaining drift:
      {{ workstation_backup_chezmoi_status_after_sync.stdout }}
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run

- name: Inspect chezmoi Git recovery state
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_backup.git_sync:
    source: "{{ workstation_backup_chezmoi_source_dir }}"
    github_token: "{{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_GITHUB_TOKEN') }}"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
  check_mode: "{{ workstation_backup_dry_run }}"
  register: workstation_backup_chezmoi_git_inspection
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run

- name: Require the tracking branch to remain reconciled after managed file synchronization
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_git_inspection.state.behind == 0
    fail_msg: The Chezmoi tracking branch changed during synchronization. Retry backup to review its new changes.
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run

- name: Require an interactive decision before publishing chezmoi changes
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_interactive
    fail_msg: >-
      Chezmoi has uncommitted or unpushed changes. Publish them manually, or rerun backup
      in an interactive terminal to review and approve committing and pushing them.
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_git_inspection.state.needs_publish

- name: Confirm publication of chezmoi source changes
  ansible.builtin.pause:
    prompt: >-
      Chezmoi recovery requires publishing {{ workstation_backup_chezmoi_source_dir }}.
      Choose [publish/abort]. Publish commits all source changes with message "Update managed dotfiles"
      and pushes branch {{ workstation_backup_chezmoi_git_inspection.state.branch }}
      to {{ workstation_backup_chezmoi_git_inspection.state.upstream }} without force.
      Ahead: {{ workstation_backup_chezmoi_git_inspection.state.ahead }} commits.
      Changes: {{ '\n' ~ workstation_backup_chezmoi_git_inspection.state.status }}
  register: workstation_backup_chezmoi_publish_choice
  until: workstation_backup_chezmoi_publish_choice.user_input | trim | lower in ['publish', 'abort']
  retries: 3
  delay: 0
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_git_inspection.state.needs_publish
    - workstation_backup_chezmoi_interactive

- name: Stop backup when chezmoi publication is declined
  ansible.builtin.fail:
    msg: Backup stopped because chezmoi changes have not been published to their recovery repository.
  when:
    - workstation_backup_chezmoi_publish_choice.user_input | default('') | trim | lower == 'abort'

- name: Publish approved chezmoi source changes and verify completion
  become: "{{ workstation_manager_use_become }}"
  become_user: "{{ workstation_manager_resolved.user.name }}"
  neilime.workstation_backup.git_sync:
    source: "{{ workstation_backup_chezmoi_source_dir }}"
    publish: true
    github_token: "{{ lookup('ansible.builtin.env', 'WORKSTATION_MANAGER_GITHUB_TOKEN') }}"
  environment:
    HOME: "{{ workstation_manager_resolved.user.home }}"
  register: workstation_backup_chezmoi_git_publication
  when:
    - not workstation_backup_dry_run
    - workstation_backup_chezmoi_publish_choice.user_input | default('') | trim | lower == 'publish'

- name: Publish verified chezmoi Git state for subsequent recovery checks
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_git_state: >-
      {{
        workstation_backup_chezmoi_git_publication.state
        | default(workstation_backup_chezmoi_git_inspection.state)
        | default(workstation_backup_chezmoi_git_preflight.state)
      }}
  when: workstation_backup_chezmoi_bootstrapped

- name: Require complete chezmoi remote synchronization before backup
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_git_state.remote_verified
      - not workstation_backup_chezmoi_git_state.needs_publish
      - workstation_backup_chezmoi_git_state.behind == 0
    fail_msg: Chezmoi is not fully published. Resolve its remaining Git changes before backup.
  when:
    - workstation_backup_chezmoi_bootstrapped
    - not workstation_backup_dry_run
