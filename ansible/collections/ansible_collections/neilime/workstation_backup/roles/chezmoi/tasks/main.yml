---
- name: Resolve backup chezmoi settings
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_config_path: >-
      {{
        workstation_manager_resolved.home_environment.chezmoi.config_path
        if workstation_manager_resolved.home_environment.chezmoi.config_path.startswith('/')
        else (
          workstation_manager_resolved.user.home ~ '/'
          ~ workstation_manager_resolved.home_environment.chezmoi.config_path[2:]
          if workstation_manager_resolved.home_environment.chezmoi.config_path.startswith('~/')
          else workstation_manager_resolved.user.home ~ '/'
          ~ workstation_manager_resolved.home_environment.chezmoi.config_path
        )
      }}
    workstation_backup_chezmoi_source_dir: >-
      {{ workstation_manager_resolved.user.home ~ '/.local/share/chezmoi' }}

- name: Check whether the managed chezmoi config file exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: "{{ workstation_backup_chezmoi_config_path }}"
  register: workstation_backup_chezmoi_config_stat

- name: Check whether the managed chezmoi source directory exists
  become: "{{ workstation_manager_use_become }}"
  ansible.builtin.stat:
    path: "{{ workstation_backup_chezmoi_source_dir }}"
  register: workstation_backup_chezmoi_source_dir_stat

- name: Resolve whether managed chezmoi state is bootstrapped
  ansible.builtin.set_fact:
    workstation_backup_chezmoi_bootstrapped: >-
      {{
        workstation_backup_chezmoi_config_stat.stat.exists
        and workstation_backup_chezmoi_source_dir_stat.stat.exists
        and workstation_backup_chezmoi_source_dir_stat.stat.isdir
      }}

- name: Assert that chezmoi bootstrap state is not partial
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_config_stat.stat.exists == workstation_backup_chezmoi_source_dir_stat.stat.exists
      - not workstation_backup_chezmoi_config_stat.stat.exists or workstation_backup_chezmoi_config_stat.stat.isreg
      - not workstation_backup_chezmoi_source_dir_stat.stat.exists or workstation_backup_chezmoi_source_dir_stat.stat.isdir
    fail_msg: >-
      Backup found partial chezmoi bootstrap state. Expected both
      {{ workstation_backup_chezmoi_config_path }} and
      {{ workstation_backup_chezmoi_source_dir }} to either exist together or
      both be absent.

- name: Require initialized chezmoi recovery state for backup
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_bootstrapped
    fail_msg: Chezmoi is not initialized. Run workstation setup before backing up managed home state.
  when: not workstation_backup_dry_run

- name: Report missing chezmoi initialization during backup dry runs
  ansible.builtin.debug:
    msg: Chezmoi is not initialized; synchronization cannot be verified. Run workstation setup before a real backup.
  when:
    - workstation_backup_dry_run
    - not workstation_backup_chezmoi_bootstrapped

- name: Check whether chezmoi is installed for backup preflight
  ansible.builtin.command:
    argv:
      - "{{ workstation_manager_resolved.home_environment.chezmoi.bin_path }}"
      - --version
  register: workstation_backup_chezmoi_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: workstation_backup_chezmoi_bootstrapped

- name: Assert that chezmoi is available for backup preflight
  ansible.builtin.assert:
    that:
      - workstation_backup_chezmoi_version.rc == 0
    fail_msg: >-
      Backup chezmoi synchronization requires {{ workstation_manager_resolved.home_environment.chezmoi.bin_path }},
      but it is not available on this machine.
  when: workstation_backup_chezmoi_bootstrapped

- name: Reconcile and verify chezmoi recovery unless explicitly skipped
  ansible.builtin.import_tasks: synchronize.yml
  when:
    - workstation_backup_chezmoi_bootstrapped
    - "'chezmoi' not in (workstation_backup_recovery_skips | default([]))"
