---
# Example private override values.
#
# Keep this file in ansible/private.override.yml in the fixed
# neilime/workstation-config repository. Setup, backup, and cleanup fetch
# that file automatically with Git unless a local override is selected. Set WORKSTATION_MANAGER_PRIVATE_OVERRIDE_FILE
# only when you need an explicit non-standard source during development,
# testing, or bootstrap without Git access to the private repository.
#
# Keep actual secrets in Bitwarden. This file is for non-secret workstation data.
desktop:
  browser: brave

home_environment:
  chezmoi:
    # Override the dotfiles repository used for a new Chezmoi checkout.
    source: "https://github.com/neilime/workstation-config.git"

secrets:
  bitwarden:
    # Override these locally when collection IDs should not live in tracked
    # Ansible defaults. The collection contents remain in Bitwarden.
    ssh_collection_id: "<your-ssh-collection-uuid>"
    gpg_collection_id: "<your-gpg-collection-uuid>"
    # Each secure note: name=profile label, custom fields id/directory, notes=Sync words.
    browser_profiles_collection_id: "<your-browser-profiles-collection-uuid>"
