---
vmType: qemu
cpus: 2
memory: "6GiB"
disk: "40GiB"

# CI fills these with the public repository and exact checkout commit. Local
# tests keep the live read-only workspace mount instead.
param:
  repository: ""
  revision: ""

video:
  display: "vnc"

# yamllint disable rule:line-length
images:
  - location: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: "x86_64"
# yamllint enable rule:line-length

ssh:
  localPort: 60022

# Use Lima's current QEMU mount provider; Ubuntu confines FUSE mounts outside /mnt and home.
mountType: "9p"
mounts:
  - location: "."
    mountPoint: "/workspace"
    writable: false
    9p:
      # Assertions and local qualification must see edits made on the host.
      cache: "none"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      repository="{{.Param.repository}}"
      revision="{{.Param.revision}}"
      if [[ -z "$repository" && -z "$revision" ]]; then
        exit 0
      fi
      [[ "$repository" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
      [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
      # Plain mode has no host mounts. Fetch only the public, tested source
      # before desktop provisioning and before any credentialed stages.
      if [[ -e /workspace ]]; then
        test "$(cat /workspace/.e2e-source)" = "$repository@$revision"
        exit 0
      fi
      archive="$(mktemp)"
      checkout="$(mktemp -d)"
      trap 'rm -f "$archive"; rm -rf "$checkout"' EXIT
      curl --fail --silent --show-error --location --retry 3 \
        --connect-timeout 10 --max-time 120 \
        "https://codeload.github.com/$repository/tar.gz/$revision" -o "$archive"
      tar --extract --gzip --file "$archive" --directory "$checkout" \
        --strip-components=1 --no-same-owner
      printf '%s\n' "$repository@$revision" >"$checkout/.e2e-source"
      chmod 0755 "$checkout"
      chmod -R a-w "$checkout"
      mv "$checkout" /workspace

  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      # Cloud images have no desktop swap reserve. Keep source builds from
      # exhausting guest RAM while GNOME and its keyring must remain alive.
      swapfile=/var/lib/workstation-manager-e2e.swap
      active_swap="$(swapon --show=NAME --noheadings)"
      if ! grep -Fxq "$swapfile" <<<"$active_swap"; then
        install -m 0600 /dev/null "$swapfile"
        fallocate --length 4GiB "$swapfile"
        mkswap "$swapfile"
        swapon "$swapfile"
      fi

  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      desktop_user="{{.User}}"

      if ! getent passwd "$desktop_user" >/dev/null; then
        echo "desktop user does not exist: $desktop_user" >&2
        exit 1
      fi

      bash /workspace/e2e-tests/base-image/install-desktop.sh
      systemctl stop gdm3

      netplan generate
      netplan apply
      test "$(netplan get network.renderer)" = "networkd"

      cat >/etc/gdm3/custom.conf <<EOF
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=$desktop_user

      [security]

      [xdmcp]

      [chooser]

      [debug]
      EOF

      # The setup phase is deliberately long enough for GNOME's default idle
      # timer to disable the virtio-gpu scanout. QEMU then captures its
      # "Display output is not active" placeholder instead of the desktop.
      # Install E2E-only system defaults before starting the login session so
      # the virtual display remains active for the post-setup screenshot.
      install -d -m 0755 /etc/dconf/profile /etc/dconf/db/local.d
      cat >/etc/dconf/profile/user <<'EOF'
      user-db:user
      system-db:local
      EOF
      cat >/etc/dconf/db/local.d/00-e2e-display <<'EOF'
      [org/gnome/desktop/session]
      idle-delay=uint32 0

      [org/gnome/desktop/screensaver]
      lock-enabled=false

      [org/gnome/settings-daemon/plugins/power]
      sleep-inactive-ac-type='nothing'
      EOF
      dconf update

      systemctl enable gdm3
      systemctl set-default graphical.target

  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      bash /workspace/e2e-tests/e2e-keyring.sh prepare
      sudo systemctl start gdm3

probes:
  - mode: readiness
    description: "sudo is available on the base Ubuntu image"
    script: |
      #!/bin/bash
      command -v sudo
  - mode: readiness
    description: "Lima networking is rendered by systemd-networkd"
    script: |
      #!/bin/bash
      set -euo pipefail
      test "$(sudo netplan get network.renderer)" = "networkd"
      systemctl is-active --quiet systemd-networkd
  - mode: readiness
    description: "desktop keyring is unlocked"
    script: |
      #!/bin/bash
      set -euo pipefail
      bash /workspace/e2e-tests/e2e-keyring.sh check
    hint: |
      The disposable desktop keyring could not be initialized or unlocked.
      Check the user provisioning output and gnome-keyring-daemon.service.
      Recreate a stopped fixture with `make e2e-reset`.
  - mode: readiness
    description: "desktop session is available"
    script: |
      #!/bin/bash
      set -euo pipefail
      desktop_user="{{.User}}"
      systemctl is-active --quiet gdm3
      gnome_shell_pid="$(pgrep --euid "$desktop_user" --oldest --exact gnome-shell)"
      test -n "$gnome_shell_pid"
      graphical_session=false
      for session_id in $(loginctl list-sessions --no-legend | awk -v user="$desktop_user" '$3 == user {print $1}'); do
        if [ "$(loginctl show-session "$session_id" -p Type --value)" = wayland ]; then
          graphical_session=true
        fi
      done
      test "$graphical_session" = true
      tr '\0' '\n' <"/proc/$gnome_shell_pid/environ" \
        | grep -F '/var/lib/flatpak/exports/share' >/dev/null
      test "$(gsettings get org.gnome.desktop.session idle-delay)" = "uint32 0"
    hint: |
      GNOME did not start for the Lima guest user.
      See /var/log/cloud-init-output.log and run `systemctl status gdm3`
      in the guest.
